<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soft Stack</title>
<style>
  :root{
    --bg:#f7f7fa; --card:#fff; --ink:#23252b; --dim:#7b7f8a; --line:#e9e9f0;
    --lilac:#6c63ff; --lilac-wash:#efeeff; --mint:#2fbf71; --mint-wash:#e8f8ef;
    --amber:#f0a429; --amber-wash:#fff5e5; --rose:#e4576f; --rose-wash:#fdeef1;
    --r:18px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);
    padding-bottom:78px}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:6;background:rgba(247,247,250,.92);backdrop-filter:blur(10px);
    padding:14px 18px 10px;border-bottom:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:12px}
  .brand{font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand i{width:26px;height:26px;border-radius:9px;background:var(--lilac);display:inline-block;position:relative}
  .brand i::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #fff;border-top-color:transparent}
  .pills{display:flex;gap:6px;overflow:auto;margin-top:10px;padding-bottom:2px}
  .pills::-webkit-scrollbar{display:none}
  .pills{scrollbar-width:none}
  .pill{border:0;background:#ececf3;color:var(--dim);border-radius:999px;padding:7px 14px;font:14px var(--sans);
    cursor:pointer;white-space:nowrap}
  .pill.is-active{background:var(--lilac);color:#fff;font-weight:600}
  .who{margin-left:auto;text-align:right;font-size:12px;color:var(--dim);line-height:1.35}
  .who b{display:block;color:var(--ink);font-size:13px}
  main{max-width:900px;margin:0 auto;padding:18px 18px 20px}
  h1{font-size:24px;letter-spacing:-.025em;margin:4px 0 4px;line-height:1.25}
  .sub{color:var(--dim);margin:0 0 16px;font-size:14.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
  .card.flat{border-color:transparent;box-shadow:0 1px 2px rgba(35,37,43,.04),0 6px 18px rgba(35,37,43,.045)}
  .card h2{font-size:15px;margin:0 0 8px;letter-spacing:-.01em}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
  .kv dt{color:var(--dim)} .kv dd{margin:0}
  .status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
  .status.ok{background:var(--mint-wash);color:#1c7a49}
  .status.warn{background:var(--amber-wash);color:#8a5a08}
  .status.bad{background:var(--rose-wash);color:#a92b42}
  .status.info{background:var(--lilac-wash);color:#4b42c9}
  .hero{background:linear-gradient(160deg,#6c63ff,#8f86ff 55%,#a6a0ff);color:#fff;border-radius:22px;padding:20px}
  .hero h1{color:#fff;font-size:26px;margin:0 0 4px}
  .hero p{margin:0;color:#eceaff;font-size:14px}
  .hero .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .stack{display:grid;gap:10px}
  .job{display:flex;gap:12px;align-items:flex-start}
  .score{flex:0 0 48px;height:48px;border-radius:14px;background:var(--lilac-wash);color:#4b42c9;
    display:grid;place-items:center;font-weight:700;font-size:15px}
  .job .t{font-weight:600;font-size:15px;line-height:1.3}
  .job .m{color:var(--dim);font-size:13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{font:14px var(--sans);border-radius:12px;border:1px solid var(--line);background:#fff;padding:9px 15px;cursor:pointer;color:var(--ink)}
  button:hover{background:#fafafd}
  button.primary{background:var(--lilac);border-color:var(--lilac);color:#fff;font-weight:600}
  button.primary:hover{background:#5b52f0}
  button.mint{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:600}
  button.ghost{background:transparent}
  button.danger{color:#a92b42;border-color:#f6ccd5;background:var(--rose-wash)}
  input[type=text]{font:16px var(--sans);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    width:170px;letter-spacing:.25em;background:#fff}
  .banner{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border:1px solid #f6ccd5;background:var(--rose-wash)}
  .banner h2{color:#a92b42;margin:0 0 4px;font-size:15px}
  .shot{background:#fff;border:1px dashed #e3c3ca;border-radius:14px;height:130px;display:grid;place-items:center;
    color:#b98b96;font-size:12.5px;margin:10px 0}
  .list{display:grid;gap:0}
  .li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .grow{flex:1;min-width:0}
  .li .t{font-size:14px;font-weight:500}
  .li .m{font-size:12.5px;color:var(--dim)}
  .num{font-variant-numeric:tabular-nums}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .tile .v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .tile .k{font-size:12.5px;color:var(--dim);margin-top:2px}
  .steps{display:grid;gap:10px}
  .step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px}
  .step .b{flex:0 0 28px;height:28px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;
    background:#ececf3;color:var(--dim)}
  .step.done .b{background:var(--mint-wash);color:#1c7a49}
  .step.now{border-color:#c9c5ff;box-shadow:0 0 0 3px #f1f0ff}
  .step.now .b{background:var(--lilac);color:#fff}
  .phone{width:360px;max-width:100%;margin:0 auto;background:#111318;border-radius:34px;padding:10px}
  .phone .scr{background:var(--bg);border-radius:26px;overflow:hidden;padding-bottom:6px}
  .phone .hd{padding:14px 16px 8px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}
  .phone .it{background:#fff;border-radius:16px;margin:0 12px 10px;padding:13px 14px;border:1px solid var(--line)}
  .phone .tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);
    margin-top:8px;text-align:center;font-size:11px;color:var(--dim);padding:8px 0 12px}
  .phone .tabs .on{color:var(--lilac);font-weight:700}
  .mock-toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#23252b;color:#fff;
    padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:99;max-width:90vw}
  .deskonly{display:block}
  .mobiletabs{display:none}
  @media(max-width:640px){
    main{padding:14px 14px 8px}
    body{padding-bottom:86px}
    .tiles{grid-template-columns:1fr 1fr}
    .deskonly{display:none}
    .mobiletabs{display:grid;position:fixed;bottom:0;left:0;right:0;background:#fff;
      border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:8;
      padding:8px 0 12px;font-size:10.5px;color:var(--dim);text-align:center}
    .mobiletabs a.on{color:var(--lilac);font-weight:700}
    .mobiletabs a b{display:block;font-size:17px;font-weight:400;line-height:1.2}
  }
</style></head><body>
<script src="../../shared/data.js"></script>
<script>
const D = window.JOBPILOT;
const nav = [['dashboard','Today'],['jobs','Jobs'],['job','Job'],['triage','Approve'],['verification','Verify'],
  ['doctor','Health'],['logs','Activity'],['scope','Sites'],['agent','Browser'],
  ['credentials','Passwords'],['data','Backup'],['onboarding','Setup'],['pwa','Phone'],['settings','Settings']];

const shell = (id, inner) => `
<header>
  <div class="row">
    <div class="brand"><i></i>jobPilot</div>
    <div class="who"><b>${D.user.name}</b>${D.hosts[1].id} · synced</div>
  </div>
  <div class="pills">${nav.map(([k,l])=>`<button class="pill" data-go="${k}">${l}</button>`).join('')}</div>
</header>
<main>${inner}</main>
<nav class="mobiletabs" aria-label="sections">
  ${[['dashboard','Today','▤'],['triage','Approve','✓'],['verification','Verify','!'],['jobs','Jobs','≡'],['doctor','Health','+']]
    .map(([k,l,g])=>`<a href="#${k}" data-go="${k}"><b>${g}</b>${l}</a>`).join('')}
</nav>`;

window.VARIANT = { id:'06-soft-stack', name:'Soft Stack', screens:{
dashboard: () => `
  <div class="hero">
    <p>Thursday morning</p>
    <h1>Three are ready for your signature.</h1>
    <p>One security check is waiting, and two jobs need a decision from you.</p>
    <div class="actions"><button class="mint" data-go="triage">Review the three</button>
      <button style="background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff" data-go="verification">See the block</button></div>
  </div>
  <div class="tiles" style="margin-bottom:12px">
    <div class="tile"><div class="v">3</div><div class="k">ready to approve</div></div>
    <div class="tile"><div class="v">2</div><div class="k">need a decision</div></div>
    <div class="tile"><div class="v" style="color:#a92b42">1</div><div class="k">blocked by a check</div></div>
    <div class="tile"><div class="v">6</div><div class="k">found today</div></div>
  </div>
  <div class="banner">
    <h2>rekrute.com is waiting on you</h2>
    <p style="margin:0 0 8px;font-size:13.5px">A security challenge appeared on page two. The agent stopped and will not touch anything until you resolve it.</p>
    <div class="actions" style="margin-top:0"><button class="primary" data-go="verification">Resolve it</button>
      <span class="status warn" style="align-self:center">frozen ${D.verification.age}</span></div>
  </div>
  <div class="card">
    <h2>What it is doing now</h2>
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span><b>rekrute.com</b> <span style="color:var(--dim);font-size:13px">${D.run.page}</span></span>
      <span class="status info">${D.run.action}</span></div>
    <div style="height:8px;border-radius:99px;background:#ececf3;overflow:hidden"><i style="display:block;height:100%;width:62%;background:var(--lilac)"></i></div>
  </div>
  <div class="card">
    <h2>Latest</h2>
    <div class="list">
      ${D.logs.slice(0,4).map(l=>`<div class="li"><span class="status ${l.lvl==='INFO'?'ok':l.lvl==='WARN'?'warn':'bad'}">${l.lvl==='INFO'?'ok':l.lvl.toLowerCase()}</span>
        <div class="grow"><div class="t">${l.msg}</div><div class="m">${l.t} · ${l.agent} · ${l.dur}</div></div></div>`).join('')}
    </div>
    <div class="actions"><button class="ghost" data-go="logs">All activity</button></div>
  </div>`,

jobs: () => `
  <h1>Jobs</h1><p class="sub">Seven after filters. Two were dropped as noise — still there if you want them.</p>
  <div class="card"><div class="stack">
  ${D.jobs.filter(j=>j.signal!=='low').map(j=>`<div class="job">
    <div class="score">${j.signal==='high'?'✓':'~'}</div>
    <div class="grow"><div class="t">${j.title}</div>
      <div class="m">${j.company ?? 'employer not named'} · ${j.city}</div>
      <div class="m">${j.source} ${j.salary?`· ${j.salary}`:''} · ${j.type}</div></div>
    <button data-go="job">Open</button></div>`).join('')}
  </div></div>
  <div class="card"><h2>Hidden as low signal</h2>
    <div class="list">
      <div class="li"><div class="grow"><div class="t">(no title)</div><div class="m">marocannonces · banner ad, not a job</div></div>
        <button data-act="Restore">Restore</button></div>
      <div class="li"><div class="grow"><div class="t">Stage marketing — non rémunéré</div><div class="m">unpaid, outside your preferences</div></div>
        <button data-act="Restore">Restore</button></div>
    </div></div>`,

triage: () => `
  <h1>Approve</h1><p class="sub">Nothing is sent from here. Approving fills the form in the real browser — you press submit.</p>
  <div class="actions" style="margin-bottom:14px"><button class="primary" data-act="Approve top 3">Approve top three</button>
    <button data-act="Snooze rest">Snooze the rest</button></div>
  <div class="card"><h2>Ready · ${D.triage.ready.length}</h2><div class="stack">
  ${D.triage.ready.map(j=>`<div class="job"><div class="score">${j.score}</div>
    <div class="grow"><div class="t">${j.title}</div><div class="m">${j.company} · ${j.city} · ${j.type}</div>
      <div class="m">${j.honesty}</div></div>
    <button class="primary" data-act="Approve ${j.title}">Approve</button></div>`).join('')}
  </div></div>
  <div class="card"><h2>Needs you · ${D.triage.needsYou.length}</h2><div class="stack">
  ${D.triage.needsYou.map(j=>`<div class="job"><div class="score" style="background:var(--amber-wash);color:#8a5a08">${j.score}</div>
    <div class="grow"><div class="t">${j.title}</div><div class="m">${j.company} · ${j.city}</div>
      <div class="m">${j.honesty}</div></div>
    <button data-act="Review ${j.title}">Review</button></div>`).join('')}
  </div></div>
  <div class="card"><h2>Set aside · ${D.triage.skip.length}</h2>
  ${D.triage.skip.map(j=>`<div class="li"><div class="grow"><div class="t">${j.title}</div>
    <div class="m">${j.company ?? 'no employer'} · ${j.honesty}</div></div>
    <button data-act="Restore ${j.title}">Restore</button></div>`).join('')}</div>`,

verification: () => `
  <h1>Verify</h1><p class="sub">The agent is paused. It will not guess, retry or move on its own.</p>
  <div class="banner">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Security challenge</h2>
      <span class="status bad">frozen ${D.verification.age}</span></div>
    <div style="font-size:13px;color:#7d2637;word-break:break-all;margin:6px 0 2px">${D.verification.site} · ${D.verification.host}</div>
    <div style="font-size:12.5px;color:#9c6a74;word-break:break-all">${D.verification.url}</div>
    <div class="shot">paused tab · screenshot</div>
    <div class="actions" style="margin-top:0"><input type="text" placeholder="000000" aria-label="code">
      <button class="primary" data-act="Submit code and resume">Submit</button>
      <button data-act="I finished — resume">I finished in the browser</button></div>
  </div>
  <div class="card"><h2>Where to find the code</h2>
    <div class="kv"><dt>Sent to</dt><dd>${D.verification.guidance.account}</dd>
      <dt>Search for</dt><dd>${D.verification.guidance.search}</dd>
      <dt>Phone</dt><dd>${D.verification.guidance.phone}</dd>
      <dt>Valid</dt><dd>${D.verification.guidance.validFor}</dd></div>
    <div class="actions"><button data-go="pwa">Take control on my phone</button>
      <button class="danger" data-act="Abandon run">Abandon this run</button></div>
  </div>
  <div class="card"><h2>Past checks</h2>
    <div class="list"><div class="li"><div class="grow"><div class="t">rekrute.com · security challenge</div>
      <div class="m">today 14:04 · VPS · open</div></div><span class="status bad">open</span></div>
      <div class="li"><div class="grow"><div class="t">linkedin.com · email code</div>
      <div class="m">yesterday 09:12 · PC</div></div><span class="status ok">1m 20s</span></div></div></div>`,

doctor: () => `
  <h1>Health</h1><p class="sub">Eleven checks pass. Two are worth fixing, none blocks a run today.</p>
  <div class="card" style="border-color:#f8d8a8;background:var(--amber-wash)">
    <div class="row" style="justify-content:space-between"><div><div class="m" style="color:#8a5a08;font-size:12.5px">browser trust</div>
      <div class="v num" style="font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1">${D.trust.score}<span style="font-size:16px;font-weight:500">/100</span></div></div>
      <span class="status warn">${D.trust.band}</span></div>
    <p style="margin:8px 0 0;font-size:13px;color:#7a5208">This is an estimate, not a guarantee. Bans are always possible.</p>
  </div>
  <div class="tiles" style="margin-bottom:12px">
    <div class="tile"><div class="v" style="color:#1c7a49">11</div><div class="k">passing</div></div>
    <div class="tile"><div class="v" style="color:#8a5a08">2</div><div class="k">warnings</div></div>
    <div class="tile"><div class="v" style="color:#a92b42">2</div><div class="k">failing</div></div>
    <div class="tile"><div class="v">15</div><div class="k">checks total</div></div>
  </div>
  <div class="card"><h2>All checks</h2><div class="list">
    ${D.doctor.map(c=>`<div class="li"><span class="status ${c.state==='PASS'?'ok':c.state==='WARN'?'warn':'bad'}">${c.state==='PASS'?'pass':c.state.toLowerCase()}</span>
      <div class="grow"><div class="t">${c.name}</div><div class="m">${c.why}</div></div>
      ${c.fix?`<button data-act="${c.fix}">Fix</button>`:''}</div>`).join('')}
  </div></div>
  <div class="actions"><button data-act="Re-run checks">Run checks again</button>
    <button class="danger" data-act="Run anyway (logged)">Run anyway, log it</button></div>`,

logs: () => `
  <h1>Activity</h1><p class="sub">Everything the agent did, in order. Secrets are stripped before they reach this page.</p>
  <div class="actions" style="margin-bottom:12px"><button>All levels</button><button>All agents</button>
    <button>Run 41</button><button class="ghost" style="margin-left:auto" data-act="Export diagnostic bundle">Export</button></div>
  <div class="card"><div class="list">
    ${D.logs.map(l=>`<div class="li"><span class="status ${l.lvl==='INFO'?'ok':l.lvl==='WARN'?'warn':'bad'}">${l.lvl==='INFO'?'ok':l.lvl.toLowerCase()}</span>
      <div class="grow"><div class="t" style="font-weight:400">${l.msg}</div>
        <div class="m">${l.t} · ${l.agent} · ${l.site} · ${l.dur}</div></div></div>`).join('')}
  </div></div>
  <div class="actions"><button data-act="Explain last error">Explain the last error</button></div>`,

scope: () => `
  <h1>Sites &amp; places</h1><p class="sub">You chose these. The agent never wanders outside them.</p>
  <div class="card"><h2>Sites</h2><div class="list">
    ${D.sites.map(s=>`<div class="li"><div class="grow"><div class="t">${s.host}</div>
      <div class="m">${s.mode} · last scan ${s.lastScan} · ${s.found} found</div></div>
      <span class="status ${s.state==='working'?'ok':s.state==='planned'?'warn':'info'}">${s.state}</span>
      <button data-act="Edit ${s.host}">Edit</button></div>`).join('')}
  </div>
  <div class="actions"><button data-act="Add a site">Add a site</button>
    <span style="font-size:12.5px;color:var(--dim);align-self:center">No adapter? Paste one URL instead.</span></div></div>
  <div class="card"><h2>Places</h2><div class="list">
    ${D.locations.map(l=>`<div class="li"><div class="grow"><div class="t">${l.country}</div>
      <div class="m">${l.cities.join(', ')||'any city'}</div></div><span class="status info">${l.count}</span></div>`).join('')}
  </div><div class="actions"><button data-act="Add a place">Add a place</button></div></div>`,

agent: () => `
  <h1>Browser</h1><p class="sub">A separate Brave profile, only for jobPilot. Your own browser is never touched.</p>
  <div class="card"><h2>Setup</h2>
    <div class="kv"><dt>Browser</dt><dd>Brave 1.98.60</dd><dt>Profile</dt><dd>spike/profile/brave</dd>
      <dt>Mode</dt><dd>visible window</dd><dt>Your browser</dt><dd>not attached</dd></div>
    <div class="actions"><button data-act="Restart browser">Restart</button>
      <button data-act="Switch to Chrome">Use Chrome instead</button></div></div>
  <div class="card"><h2>Staying signed in</h2>
    <p style="margin:0 0 10px;font-size:13.5px">Brave desktop has no global “forget me on close” switch. These three settings decide whether your sessions survive a restart:</p>
    <div class="list">
      <div class="li"><span class="status ok">ok</span><div class="grow"><div class="t">Cookies survive close</div></div></div>
      <div class="li"><span class="status ok">ok</span><div class="grow"><div class="t">History survives close</div></div></div>
      <div class="li"><span class="status ok">ok</span><div class="grow"><div class="t">Continue where you left off</div></div></div>
    </div>
    <div class="actions"><button class="primary" data-act="Re-check now">Check again</button></div></div>
  <div class="card"><h2>Signed out</h2>
    <div class="actions" style="margin-top:0"><span class="status bad">rekrute.com</span>
      <span class="status bad">linkedin.com</span>
      <button data-go="credentials" style="margin-left:auto">Open passwords</button></div></div>`,

credentials: () => `
  <h1>Passwords</h1><p class="sub">Encrypted on this machine. Never sent to a model, never written to a log.</p>
  <div class="card"><div class="list">
    ${D.credentials.map(c=>`<div class="li"><div class="grow"><div class="t">${c.site}</div>
      <div class="m">${c.user} · ${c.kind} · used ${c.uses} times</div></div>
      <button data-act="Reveal ${c.site}">Reveal</button></div>`).join('')}
  </div>
  <div class="actions"><button data-act="Lock vault">Lock it now</button>
    <button data-act="Rotate passphrase">Change passphrase</button></div></div>
  <div class="card"><h2>Recent access</h2><div class="list">
    <div class="li"><div class="grow"><div class="t">Filled the rekrute.com form</div><div class="m">today 14:04 · run 41</div></div></div>

  <div class="tiles" style="margin-bottom:12px">
    ${D.hosts.map(h=>`<div class="tile"><div class="k">${h.id} · ${h.label}</div>
      <div class="v num" style="margin:4px 0 2px">${h.events}</div><div class="k">events · ${h.db}</div>
      <div class="k">heartbeat ${h.heartbeat}</div></div>`).join('')}
  </div>
  <div class="card"><h2>Sync</h2>
    <div class="row" style="justify-content:space-between"><span>${D.sync.lastDelta}</span>
      <span class="status info">${D.sync.state}</span></div>
    <div style="font-size:12.5px;color:var(--dim);margin-top:4px">${D.sync.hash}</div>
