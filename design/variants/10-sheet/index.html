<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet</title>
<style>
  :root{
    --bg:#fff; --ink:#1f2328; --dim:#57606a; --line:#d0d7de; --head:#f6f8fa; --zebra:#fbfcfd;
    --blue:#0550ae; --sel:#ddf4ff; --green:#1a7f37; --amber:#9a6700; --red:#cf222e;
    --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:12.5px/1.35 var(--sans);display:flex;flex-direction:column}
  a{color:var(--blue);text-decoration:none}
  .titlebar{display:flex;align-items:center;gap:14px;padding:6px 12px;border-bottom:1px solid var(--line);background:#fff}
  .logo{width:18px;height:18px;border-radius:4px;background:var(--green);display:inline-block}
  .doc{font-weight:600;font-size:12.5px}
  .doc span{color:var(--dim);font-weight:400}
  .save{margin-left:auto;font-size:11.5px;color:var(--dim)}
  .save b{color:var(--green);font-weight:600}
  .menus{display:flex;gap:2px;padding:2px 10px;border-bottom:1px solid var(--line);background:#fff;align-items:center}
  .menus span{padding:3px 8px;font-size:12px;color:var(--dim);cursor:default}
  .menus span:hover{background:var(--head)}
  .menus .sep{width:1px;height:14px;background:var(--line);margin:0 6px;padding:0}
  .menus button{font:12px var(--sans);border:1px solid var(--line);background:var(--head);border-radius:4px;
    padding:2px 8px;cursor:pointer;color:var(--ink)}
  .menus button:hover{background:#eaeef2}
  .menus button.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .fbar{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);font-size:12px;background:#fff}
  .cellref{width:78px;padding:3px 8px;border-right:1px solid var(--line);color:var(--ink);text-align:center;
    font-family:var(--mono);font-size:11.5px;background:var(--head)}
  .fx{padding:3px 8px;color:var(--dim);border-right:1px solid var(--line);font-style:italic}
  .fval{padding:3px 8px;font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gridwrap{flex:1;overflow:auto;background:#fff}
  table.sheet{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;table-layout:fixed}
  table.sheet th{position:sticky;top:0;z-index:2;background:var(--head);border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);font-weight:500;font-size:10.5px;color:var(--dim);padding:2px 6px;
    text-align:center;height:22px}
  table.sheet th.rowh{width:38px;position:sticky;left:0;z-index:3;text-align:center;font-weight:400;
    background:var(--head);border-right:1px solid var(--line);color:var(--dim);font-size:10.5px}
  table.sheet td{border-bottom:1px solid #eaeef2;border-right:1px solid #eaeef2;padding:4px 7px;vertical-align:top;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;height:26px}
  table.sheet tr:nth-child(even) td{background:var(--zebra)}
  table.sheet td.rowh{position:sticky;left:0;background:var(--head);color:var(--dim);text-align:center;
    font-family:var(--mono);font-size:10.5px;z-index:1;border-right:1px solid var(--line)}
  table.sheet tr:hover td{background:#f0f6ff}
  table.sheet td.sel{background:var(--sel)!important;outline:2px solid var(--blue);outline-offset:-2px}
  .g{color:var(--dim)}.mono{font-family:var(--mono);font-size:11px}
  .b{font-weight:600}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:10.5px;color:var(--dim);background:#fff}
  .pill.g{color:var(--green);border-color:#b7e1c3;background:#e9f7ee}
  .pill.a{color:var(--amber);border-color:#f0d8a0;background:#fdf6e3}
  .pill.r{color:var(--red);border-color:#f7c4c4;background:#fdeeee}
  .pill.b{color:var(--blue);border-color:#b6d4f7;background:#e7f2fd}
  .link{color:var(--blue);cursor:pointer}
  .mini{display:inline-flex;gap:3px;align-items:center}
  button.cellbtn{font:11px var(--sans);border:1px solid var(--line);background:#fff;border-radius:3px;padding:0 6px;
    cursor:pointer;color:var(--ink);line-height:16px}
  button.cellbtn:hover{background:var(--head)}
  button.cellbtn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  button.cellbtn.d{color:var(--red);border-color:#f0b8b8}
  input.sheetin{font:11px var(--mono);border:1px solid var(--blue);padding:1px 4px;width:132px;border-radius:2px}
  .shot{border:1px dashed #c9d1d9;color:var(--dim);font-size:11px;text-align:center;padding:26px 8px;background:#fbfcfd}
  .tabstrip{flex:0 0 auto;display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--head);
    overflow:auto;height:32px}
  .tabstrip .ctrl{display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--dim);font-size:10.5px;border-right:1px solid var(--line)}
  .tabstrip a{display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:var(--dim);
    border-right:1px solid var(--line);white-space:nowrap}
  .tabstrip a.is-active{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--green)}
  .tabstrip a:hover{background:#eef1f4}
  .fnote{flex:0 0 auto;display:flex;gap:16px;padding:2px 10px;font-size:10.5px;color:var(--dim);
    background:#fff;border-top:1px solid var(--line)}
  .fnote b{color:var(--ink);font-weight:500}
  .mock-toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;
    padding:5px 11px;border-radius:4px;font-size:11.5px;z-index:99}
  @media(max-width:760px){
    table.sheet td{max-width:220px}
    .menus{flex-wrap:wrap;padding:3px 8px}
    .fnote{display:none}
    /* spreadsheets do not fit a phone: keep the row label and the row's action */
    table.sheet{table-layout:auto}
    table.sheet :is(th,td):nth-child(n+4):nth-last-child(n+2){display:none}
    table.sheet th.rowh,table.sheet td.rowh{width:30px;padding:4px 2px}
    table.sheet th:nth-child(2),table.sheet td:nth-child(2){width:44%!important;white-space:normal}
    table.sheet th:last-child,table.sheet td:last-child{white-space:normal;padding-left:4px}
    table.sheet td{height:auto;padding:5px 5px;font-size:11.5px}
    table.sheet td .cellbtn{font-size:10px;padding:1px 4px}
    .fbar .fval{font-size:10px}
    .titlebar{flex-wrap:wrap;gap:6px}
    .save{margin-left:0}
  }
</style></head><body>
<script src="../../shared/data.js"></script>
<script>

  <span class="sep"></span>
  ${footer?.[0]||''}

  <span class="pill b">${D.hosts[1].id} ${D.hosts[1].label}</span>
  <span class="pill">trust ${D.trust.score}</span>
</div>
<div class="fbar"><div class="cellref">${ref}</div><div class="fx">fx</div>
  <div class="fval">${formula}</div></div>
<div class="gridwrap"><table class="sheet">${body}</table></div>
<div class="fnote"><span><b>Sum</b> ${D.trust.score}</span><span>Count 12</span><span>Ready</span>
  <span style="margin-left:auto">P0 mockup · no real data leaves this page</span></div>
<nav class="tabstrip" aria-label="sheets"><div class="ctrl">◀ ▶</div>
  ${sheets.map(([k,l])=>`<a href="#${k}" data-go="${k}">${l}</a>`).join('')}</nav>`;

const cols = (labels, widths=[]) => `<thead><tr><th class="rowh"></th>
  ${labels.map((l,i)=>`<th${widths[i]?` style="width:${widths[i]}"`:''}>${l}</th>`).join('')}</tr></thead>`;

// rows: array of arrays; first entry is row number
const rows = (data, selRow) => `<tbody>${data.map((r,ri)=>`<tr>${r.map((c,ci)=>
  ci===0?`<td class="rowh">${c}</td>`:`<td class="${selRow===ri&&ci===1?'sel':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
