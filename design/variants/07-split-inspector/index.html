<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split Inspector</title>
<style>
  :root{
    --bg:#fafafa; --pane:#fff; --ink:#1f2328; --dim:#656d76; --line:#d8dee4; --line2:#eaeef2;
    --sel:#e8f0fe; --blue:#1a73e8; --green:#1a7f37; --amber:#9a6700; --red:#cf222e;
    --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.45 var(--sans);display:flex;flex-direction:column}
  a{color:var(--blue);text-decoration:none}
  .toolbar{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;background:#f6f8fa;
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:600;font-size:12.5px;letter-spacing:-.01em}
  .brand i{color:var(--blue);font-style:normal}
  .search{flex:0 1 320px;background:#fff;border:1px solid var(--line);border-radius:6px;height:24px;
    display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--dim)}
  .search kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font:10px var(--mono);margin-left:auto;color:var(--dim)}
  .hots{margin-left:auto;display:flex;gap:6px;align-items:center}
  .hp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:1px 8px;font-size:11px;color:var(--dim)}
  .hp b{color:var(--ink);font-weight:600}
  .hp .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px}
  .hp .d.y{background:var(--amber)}
  .body{flex:1;display:grid;grid-template-columns:196px minmax(0,1fr) 332px;min-height:0}
  .tree{border-right:1px solid var(--line);background:#f6f8fa;overflow:auto;padding:8px 0}
  .tree .grp{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:8px 12px 3px}
  .tree a{display:flex;align-items:center;gap:7px;padding:4px 12px;color:var(--ink);font-size:12.5px}
  .tree a:hover{background:#eef1f4}
  .tree a.is-active{background:var(--sel);color:#0b4bb3;font-weight:600;box-shadow:inset 2px 0 0 var(--blue)}
  .tree a .g{width:12px;text-align:center;color:var(--dim);font-size:11px}
  .tree a .c{margin-left:auto;font-size:10.5px;background:#e6eaef;border-radius:999px;padding:0 5px;color:var(--dim)}
  .tree a.is-active .c{background:#d2e3fc;color:#0b4bb3}
  .tree .foot{border-top:1px solid var(--line);margin-top:8px;padding:8px 12px;color:var(--dim);font-size:11px;line-height:1.5}
  .main{overflow:auto;background:var(--bg);padding:10px 12px 20px;min-width:0}
  .aside{overflow:auto;background:var(--pane);border-left:1px solid var(--line);padding:0 0 20px}
  .crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);margin-bottom:8px}
  .crumb b{color:var(--ink);font-weight:600}
  .h{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .h h1{font-size:14px;margin:0;letter-spacing:-.01em}
  .h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .panel{background:var(--pane);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden}
  .panel > header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line2);
    background:#f6f8fa;font-size:11.5px;color:var(--dim)}
  .panel > header b{color:var(--ink);font-weight:600}
  .panel .c{padding:8px 10px}
  .panel .c.tight{padding:0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-size:10.5px;color:var(--dim);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line);
    background:#fbfcfd;white-space:nowrap;position:sticky;top:0}
  td{padding:4px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  tbody tr:hover td{background:#f6f8fa}
  tbody tr.sel td{background:var(--sel)}
  .mono{font-family:var(--mono);font-size:11px}
  .dim{color:var(--dim)}
  .b{font-weight:600}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 6px;font-size:10.5px;color:var(--dim);background:#fff}
  .tag.b{color:var(--blue);border-color:#b6d0f7;background:#e8f0fe}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);vertical-align:1px}
  .dot.y{background:var(--amber)}.dot.r{background:var(--red)}.dot.g{background:#8b949e}
  button{font:11.5px var(--sans);border:1px solid var(--line);background:#f6f8fa;border-radius:5px;
    padding:3px 9px;cursor:pointer;color:var(--ink)}
  button:hover{background:#eef1f4}
  button.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  button.p:hover{background:#1668d0}
  button.d{color:var(--red);border-color:#f5c2c7;background:#fff5f6}
  input[type=text]{font:12px var(--sans);border:1px solid var(--line);border-radius:5px;padding:4px 8px;background:#fff}
  input.code{font-family:var(--mono);letter-spacing:.3em;width:130px}
  .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
  .stat div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
  .stat .k{font-size:10.5px;color:var(--dim)}
  .stat .v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .v.r{color:var(--red)}
  .bar{height:5px;background:#eaeef2;border-radius:99px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--blue)}
  .bar.r i{background:var(--red)}
  .shot{border:1px dashed #c9d1d9;border-radius:5px;height:120px;display:grid;place-items:center;
    color:var(--dim);font-size:11.5px;margin:6px 0;background:#fbfcfd}
  .alert{border:1px solid #ffcdd2;background:#fff5f6;border-radius:6px;padding:9px 10px;margin-bottom:8px}
  .alert h2{margin:0 0 3px;font-size:12.5px;color:#a40e26}
  .alert p{margin:0;font-size:11.5px;color:#8c333a}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:2px 8px;font-size:11.5px}
  .kv dt{color:var(--dim)}.kv dd{margin:0}
  .log{font:11px/1.6 var(--mono);padding:2px 0;border-bottom:1px solid var(--line2);display:grid;
    grid-template-columns:52px 44px 56px 1fr;gap:6px}
  .log .lv{font-size:9.5px;text-align:center;border-radius:3px;line-height:14px}
  .lv.INFO{background:#dafbe1;color:#116329}
  .lv.WARN{background:#fff8c5;color:#7d4e00}
  .lv.ERROR{background:#ffebe9;color:#a40e26}
  .lv.ALERT{background:#cf222e;color:#fff;font-weight:700}
  .phone{width:300px;margin:0 auto;border:1px solid var(--line);border-radius:20px;background:#fff;
    box-shadow:0 8px 24px rgba(31,35,40,.12);overflow:hidden}
  .phone .hd{padding:8px 12px;border-bottom:1px solid var(--line2);font-size:11px;display:flex;justify-content:space-between;color:var(--dim)}
  .phone .it{padding:10px 12px;border-bottom:1px solid var(--line2)}
  .phone .it b{font-size:12.5px}
  .statusbar{height:24px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 10px;
    background:var(--blue);color:#fff;font-size:11px}
  .statusbar .r{margin-left:auto;display:flex;gap:12px}
  .mock-toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;
    padding:5px 10px;border-radius:5px;font-size:11.5px;z-index:99}
  @media(max-width:1100px){.body{grid-template-columns:180px minmax(0,1fr)}.aside{display:none}}
  @media(max-width:720px){
    .body{grid-template-columns:1fr}
    .hots{display:none}
    .statusbar span:nth-child(2),.statusbar span:nth-child(4),.statusbar .r span:first-child{display:none}
    .statusbar{gap:8px;font-size:10px;overflow:hidden;white-space:nowrap}
    .tree{display:flex;gap:2px;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:4px 6px}
    .tree::-webkit-scrollbar{display:none}
    .tree .grp,.tree .foot{display:none}
    .tree a{white-space:nowrap;border-radius:5px;padding:3px 8px}
    .tree a.is-active{box-shadow:none}
    .tree a .c{display:none}
    .search{display:none}
    .stat{grid-template-columns:1fr 1fr}
    .phone{width:100%}
  }
</style></head><body>
<script src="../../shared/data.js"></script>
<script>
const D = window.JOBPILOT;
const groups = [
  ['Work', [['dashboard','Today','▤',''],['jobs','Jobs','≡','7'],['triage','Triage','✓','5'],['verification','Verification','!','1']]],
  ['System', [['doctor','Doctor','+','4'],['logs','Logs','»',''],['scope','Sites','◎','6'],['agent','Browser','◫','']]],
  ['Account', [['credentials','Vault','⌘','4'],['data','Data','⇄',''],['onboarding','Setup','↦','4/5'],['pwa','Phone','▭','']]],
];

const shell = (id, main, aside) => `
<div class="toolbar">
  <div class="brand">job<i>Pilot</i> <span class="dim" style="font-weight:400">workbench</span></div>
  <div class="search"><span>⌕</span><span>filter jobs, logs, checks…</span><kbd>⌘P</kbd></div>
  <div class="hots">${D.hosts.map(h=>`<span class="hp"><i class="d ${h.state==='green'?'':'y'}"></i><b>${h.id}</b> ${h.label}</span>`).join('')}
    <span class="hp">trust <b>${D.trust.score}</b></span></div>
</div>
<div class="body">
  <nav class="tree" aria-label="navigator">
    ${groups.map(([g,items])=>`<div class="grp">${g}</div>${items.map(([k,l,gl,c])=>
      `<a href="#${k}" data-go="${k}"><span class="g">${gl}</span>${l}${c?`<span class="c">${c}</span>`:''}</a>`).join('')}`).join('')}
    <div class="foot">run 41 · ${D.run.host}<br>${D.run.site}<br>${D.run.action}</div>
  </nav>
  <div class="main">${main}</div>
  <div class="aside">${aside}</div>
</div>
<div class="statusbar">
  <span>⎇ run 41 · ${D.run.state}</span><span>${D.run.site} · page 1/3</span>
  <span>trust 76 · caution</span><span>db 41 MB</span>
  <span class="r"><span>sync ${D.hosts[1].lastSync}</span><span>P0 mockup</span></span>
</div>`;

const asideHead = (t, sub) => `<div style="padding:10px 12px 8px;border-bottom:1px solid var(--line2)">
  <div style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)">${t}</div>
  ${sub?`<div style="font-size:12px;color:var(--dim);margin-top:2px">${sub}</div>`:''}</div>`;

window.VARIANT = { id:'07-split-inspector', name:'Split Inspector', screens:{
dashboard: () => [`
  <div class="crumb"><b>Work</b><span>/</span><span>Today</span></div>
  <div class="h"><h1>Run 41</h1><div class="r"><span class="tag b">${D.run.state}</span>
    <button data-act="Pause all agents">Pause</button><button data-act="Open live browser">Live browser</button></div></div>
  <div class="stat">
    <div><div class="k">found today</div><div class="v">6</div><div class="k">2 dropped</div></div>
    <div><div class="k">ready</div><div class="v">3</div><div class="k">awaiting a click</div></div>
    <div><div class="k">needs you</div><div class="v">2</div><div class="k">unclear signal</div></div>
    <div><div class="k">blocked</div><div class="v r">1</div><div class="k">verification wall</div></div>
  </div>
  <div class="alert">
    <h2>rekrute.com — security challenge · frozen ${D.verification.age}</h2>
    <p>${D.verification.url}</p>
    <div style="display:flex;gap:6px;margin-top:6px"><button class="p" data-go="verification">Resolve</button>
      <button data-act="Abandon run">Abandon run</button></div>
  </div>
  <div class="panel"><header><b>Now running</b><span class="dim">${D.run.site}</span>
    <span style="margin-left:auto" class="dim">${D.run.elapsed}</span></header>
    <div class="c"><div class="dim">${D.run.page} · ${D.run.action}</div>
      <div class="bar"><i style="width:62%"></i></div></div></div>
  <div class="panel"><header><b>Log tail</b><span style="margin-left:auto" class="dim">live</span></header>
    <div class="c tight" style="padding:6px 10px">
    ${D.logs.slice(0,5).map(l=>`<div class="log"><span class="dim">${l.t}</span>
      <span class="lv ${l.lvl}">${l.lvl}</span><span class="dim">${l.agent}</span><span>${l.msg}</span></div>`).join('')}
    </div></div>`,
  `
  ${asideHead('Selection','run 41 · lease 30m')}
  <div style="padding:10px 12px">
    <div class="kv"><dt>host</dt><dd>${D.run.host}</dd><dt>pid</dt><dd class="mono">24817</dd>
      <dt>started</dt><dd>14:02</dd><dt>pages</dt><dd>1 of 3</dd>
      <dt>found</dt><dd>6 valid · 2 dropped</dd><dt>heartbeat</dt><dd>5s</dd></div>
    <div style="margin-top:10px;font-size:11.5px;color:var(--dim)">The lease stops a second run from starting on the other host.</div>
  </div>
  <div style="border-top:1px solid var(--line2)">${asideHead('Signals','')}
    <div style="padding:10px 12px;font-size:11.5px">
      <div style="display:flex;justify-content:space-between"><span>match ≥ 80</span><b>3</b></div>
      <div style="display:flex;justify-content:space-between"><span>named employer</span><b>4 of 6</b></div>
      <div style="display:flex;justify-content:space-between"><span>salary stated</span><b>2 of 6</b></div>
      <div style="display:flex;justify-content:space-between;color:var(--red)"><span>challenge walls</span><b>1</b></div>
    </div></div>
  </div>`],

jobs: () => [`
  <div class="crumb"><b>Work</b><span>/</span><span>Jobs</span><span>/</span><span>7 of 9</span></div>
  <div class="h"><h1>Listings</h1><div class="r"><button data-act="Filter">Filter</button>
    <button data-act="Export list">Export</button></div></div>
  <div class="panel"><div class="c tight">
  <table><thead><tr><th>Title</th><th>Employer</th><th>City</th><th>Source</th><th>Pay</th><th>Signal</th></tr></thead>
  <tbody>${D.jobs.filter(j=>j.signal!=='low').map((j,i)=>`<tr class="${i===0?'sel':''}">
    <td><b>${j.title}</b></td><td class="${j.company==='unnamed'?'dim':''}">${j.company ?? '—'}</td>
    <td>${j.city}</td><td class="dim">${j.source}</td><td>${j.salary ?? '—'}</td>
    <td><span class="tag">${j.signal}</span></td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><header><b>Dropped as noise</b><span style="margin-left:auto" class="dim">kept, never deleted</span></header>
    <div class="c tight"><table><tbody>
      <tr><td>(no title)</td><td class="dim">marocannonces · banner ad</td><td><button data-act="Restore">Restore</button></td></tr>
      <tr><td>Stage marketing — non rémunéré</td><td class="dim">unpaid, outside preferences</td><td><button data-act="Restore">Restore</button></td></tr>
    </tbody></table></div></div>`,
  `${asideHead('Conseiller de service','Auto Hall · Casablanca')}
  <div style="padding:10px 12px">
    <div style="height:7px;background:#eaeef2;border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:88%;background:var(--green)"></i></div>
    <div class="kv" style="margin-top:10px">
      <dt>match</dt><dd><b>88</b> / 100</dd><dt>contract</dt><dd>CDI</dd><dt>level</dt><dd>Junior, 1–3 years</dd>
      <dt>education</dt><dd>Bac +2</dd><dt>sector</dt><dd>Automobile</dd><dt>posted</dt><dd>today</dd>
      <dt>salary</dt><dd class="dim">not stated</dd></div>
  </div>
  <div style="border-top:1px solid var(--line2)">${asideHead('Cover letter','Resume v3 · 182 words')}
    <div style="padding:10px 12px;font-size:11.5px;line-height:1.6">
      “Your service advisor role matches the two years I spent handling customer intake and warranty files at…”</div>
    <div style="padding:0 12px 12px;display:flex;gap:6px"><button data-act="Open letter">Open</button>
      <button class="p" data-act="Approve">Approve</button></div></div>`],

triage: () => [`
  <div class="crumb"><b>Work</b><span>/</span><span>Triage</span></div>
  <div class="h"><h1>Awaiting approval · 5</h1><div class="r">
    <button data-act="Approve top 3" class="p">Approve top 3</button><button data-act="Snooze rest">Snooze</button></div></div>
  <div class="panel"><div class="c tight">
  <table><thead><tr><th style="width:56px">Match</th><th>Job</th><th>Employer</th><th>Honesty note</th><th style="width:74px">Group</th></tr></thead>
  <tbody>${[['Ready',D.triage.ready,'sel'],['Needs you',D.triage.needsYou,''],['Skip',D.triage.skip,'']].flatMap(([g,list,cls])=>
    list.map((j,i)=>`<tr class="${i===0?cls:''}"><td><b>${j.score}</b></td>
      <td>${j.title}<div class="dim" style="font-size:10.5px">${j.city} · ${j.type}</div></td>
      <td class="${j.company==='unknown employer'?'dim':''}">${j.company ?? 'not named'}</td>
      <td class="dim">${j.honesty}</td><td>${g}</td></tr>`)).join('')}</tbody></table></div></div>
  <div class="panel"><header><b>Guard rails</b></header><div class="c" style="font-size:11.5px">
    Approving prepares everything; the submit click is always yours. A frozen run cannot approve anything.</div></div>`,
  `${asideHead('Queue summary','')}
  <div style="padding:10px 12px">
    <div style="display:flex;justify-content:space-between;padding:3px 0"><span>Ready</span><b>3</b></div>
    <div style="display:flex;justify-content:space-between;padding:3px 0"><span>Needs a decision</span><b>2</b></div>
    <div style="display:flex;justify-content:space-between;padding:3px 0"><span>Skip pile</span><b>2</b></div>
    <div style="display:flex;justify-content:space-between;padding:3px 0"><span>Submitted today</span><b>0</b></div>
  </div>
  <div style="border-top:1px solid var(--line2)">${asideHead('Why 88','Auto Hall')}
    <div style="padding:10px 12px;font-size:11.5px">
      <div>title match <b>strong</b></div><div>city match <b>exact</b></div>
      <div>seniority match <b>exact</b></div><div>sector <b>adjacent</b></div>
      <div class="dim" style="margin-top:6px">Every claim in the letter maps to a line in the resume.</div>
      <div style="margin-top:8px"><button data-go="verification" class="d">1 run is blocked</button></div>
    </div></div>`],

verification: () => [`
  <div class="crumb"><b>Work</b><span>/</span><span>Verification</span></div>
  <div class="h"><h1>Security challenge · rekrute.com</h1><div class="r"><span class="tag" style="color:var(--red);border-color:#ffcdd2;background:#fff5f6">frozen ${D.verification.age}</span></div></div>
  <div class="alert"><h2>The agent stopped here and will not continue without you</h2>
    <p>${D.verification.url}</p></div>
  <div class="panel"><header><b>Evidence</b><span class="dim">captured on ${D.verification.host} at ${D.verification.at}</span></header>
    <div class="c"><div class="shot">screenshot of the paused tab · one-time values redacted</div>
      <div class="dim" style="font-size:11px">Only the viewport is captured; browser chrome and native dialogs are not visible to the agent.</div></div></div>
  <div class="panel"><header><b>Resolve</b></header><div class="c">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <input class="code" type="text" placeholder="000000" aria-label="code">
      <button class="p" data-act="Submit code and resume">Submit and resume</button>
      <button data-act="I finished — resume">I finished in the browser</button>
      <button class="d" data-act="Abandon run">Abandon</button></div>
    <div class="dim" style="font-size:11px;margin-top:6px">No auto-retry, no timer, no solving service. Ever.</div></div></div>`,
  `${asideHead('Where the code went','')}
  <div style="padding:10px 12px">
    <div class="kv"><dt>account</dt><dd>${D.verification.guidance.account}</dd>
      <dt>search</dt><dd class="mono">${D.verification.guidance.search}</dd>
      <dt>phone</dt><dd class="mono">${D.verification.guidance.phone}</dd>
      <dt>valid</dt><dd>${D.verification.guidance.validFor}</dd>
      <dt>run</dt><dd>${D.verification.run}</dd></div>
  </div>
  <div style="border-top:1px solid var(--line2)">${asideHead('History','')}
    <div style="padding:10px 12px;font-size:11.5px">
      <div style="padding:4px 0;border-bottom:1px solid var(--line2)">today 14:04 · rekrute.com · <b style="color:var(--red)">open</b></div>
      <div style="padding:4px 0">yesterday 09:12 · linkedin.com · 1m 20s</div>
    </div></div>`],

doctor: () => [`
  <div class="crumb"><b>System</b><span>/</span><span>Doctor</span></div>
  <div class="h"><h1>Checks</h1><div class="r"><button data-act="Re-run checks">Re-run all</button>
    <button class="d" data-act="Run anyway (logged)">Run anyway</button></div></div>
  <div class="stat">
    <div><div class="k">trust</div><div class="v">76</div><div class="k">caution</div></div>
    <div><div class="k">passing</div><div class="v">11</div><div class="k">of 15</div></div>
    <div><div class="k">warnings</div><div class="v" style="color:var(--amber)">2</div><div class="k">not blocking</div></div>
    <div><div class="k">failing</div><div class="v r">2</div><div class="k">logged</div></div>
  </div>
  <div class="panel"><div class="c tight"><table><thead><tr><th>Check</th><th>State</th><th>Why</th><th>Fix</th></tr></thead>
  <tbody>${D.doctor.map((c,i)=>`<tr class="${i===5?'sel':''}"><td>${c.name}</td>
    <td><span class="tag" style="color:${c.state==='PASS'?'var(--green)':c.state==='WARN'?'var(--amber)':'var(--red)'}">${c.state}</span></td>
    <td class="dim">${c.why}</td><td>${c.fix?`<button data-act="${c.fix}">Fix</button>`:'<span class="dim">—</span>'}</td></tr>`).join('')}
  </tbody></table></div></div>`,
  `${asideHead('WebGL / renderer','FAIL · weight 8')}
  <div style="padding:10px 12px;font-size:11.5px;line-height:1.6">
    <p style="margin:0 0 6px">No GL context on this host. Websites that fingerprint rendering see an unusual machine.</p>
    <p style="margin:0 0 8px;color:var(--dim)">Forcing SwiftShader would produce a recognisable software renderer — a different tell, not a fix.</p>
    <div class="kv"><dt>host</dt><dd>VPS · aarch64</dd><dt>fix</dt><dd>Mesa llvmpipe (apt)</dd><dt>needs</dt><dd>a restart</dd></div>
    <div style="margin-top:8px"><button data-act="Open install instructions">Open instructions</button></div>
  </div>
  <div style="border-top:1px solid var(--line2)">${asideHead('Trust breakdown','')}
    <div style="padding:8px 12px">
      ${D.trust.signals.map(s=>`<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0">
        <span class="${s.state==='PASS'?'dim':''}">${s.name}</span><b style="color:${s.state==='PASS'?'var(--green)':'var(--red)'}">${s.state==='PASS'?'+':''}${s.state==='PASS'?s.weight:'−'+s.weight}</b></div>`).join('')}
      <div class="dim" style="font-size:11px;margin-top:6px">An estimate, never a guarantee. Bans remain possible at any score.</div>
    </div></div>`],

logs: () => [`
  <div class="crumb"><b>System</b><span>/</span><span>Logs</span><span>/</span><span>run 41</span></div>

    <button data-act="Explain last error">Explain last error</button></div></div>
  <div class="panel"><header><b>Filters</b><span class="dim">level: all · agent: all · site: all</span>
    <span style="margin-left:auto" class="dim">retention 30 days</span></header>
    <div class="c tight" style="padding:6px 10px">
    ${D.logs.map((l,i)=>`<div class="log" style="${i===6?'background:var(--sel)':''}">
      <span class="dim">${l.t}</span><span class="lv ${l.lvl}">${l.lvl}</span>
      <span class="dim">${l.agent}</span><span>${l.msg}</span></div>`).join('')}
    </div></div>`,
  `${asideHead('Entry','14:04:12 · scout')}
  <div style="padding:10px 12px">
    <div class="kv"><dt>level</dt><dd style="color:var(--red)">ALERT</dd><dt>agent</dt><dd>scout</dd>
      <dt>site</dt><dd>rekrute.com</dd><dt>run</dt><dd>41</dd><dt>duration</dt><dd>1.4s</dd>
      <dt>host</dt><dd>VPS</dd></div>

    <div class="mono" style="margin-top:10px;background:#f6f8fa;border:1px solid var(--line);border-radius:5px;padding:8px;font-size:10.5px;line-height:1.6">
      { "event": "verification.detected",<br>"site": "rekrute.com",<br>"host": "vps",<br>"action": "freeze" }</div>
    <div class="dim" style="font-size:11px;margin-top:8px">Screenshot and URL are attached to the event; cookies and codes are stripped.</div>

scope: () => [`
  <div class="crumb"><b>System</b><span>/</span><span>Sites</span></div>
  <div class="h"><h1>Sites &amp; places</h1><div class="r"><button class="p" data-act="Add a site">Add site</button></div></div>
  <div class="panel"><div class="c tight"><table><thead><tr><th>Site</th><th>Mode</th><th>State</th><th>Last scan</th><th>Found</th><th></th></tr></thead>
  <tbody>${D.sites.map((s,i)=>`<tr class="${i===0?'sel':''}"><td>${s.host}</td>
    <td><span class="tag b">${s.mode}</span></td>
    <td><span class="dot ${s.state==='working'?'':s.state==='planned'?'y':'g'}"></span> ${s.state}</td>
    <td class="dim">${s.lastScan}</td><td>${s.found}</td>
    <td><button data-act="Edit ${s.host}">Edit</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><header><b>Places</b><span style="margin-left:auto" class="dim">asked at setup, editable forever</span></header>
    <div class="c tight"><table><tbody>${D.locations.map(l=>`<tr><td><b>${l.country}</b></td>
      <td class="dim">${l.cities.join(', ')||'any city'}</td><td>${l.count}</td>
      <td><button data-act="Edit ${l.country}">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`,
  `${asideHead('Mode: adapter','rekrute.com')}
  <div style="padding:10px 12px;font-size:11.5px;line-height:1.6">
    <p style="margin:0 0 8px">Named selectors, tested against a fixture each run. If a selector misses, the run logs it and falls back to generic extraction rather than saving a half-parsed card.</p>
    <div class="kv"><dt>cards</dt><dd>10 per page</dd><dt>paging</dt><dd>yes, with dedupe</dd>
      <dt>login</dt><dd>not required to read</dd><dt>last miss</dt><dd class="dim">none today</dd></div>
  </div>
  <div style="border-top:1px solid var(--line2)">${asideHead('No crawl mode','')}
    <div style="padding:10px 12px;font-size:11.5px">There is no setting that turns jobPilot into a web spider. Sites are added by name; unlisted pages are read one URL at a time, at your request.</div></div>`],

agent: () => [`
  <div class="crumb"><b>System</b><span>/</span><span>Browser</span></div>
  <div class="h"><h1>Agent browser</h1><div class="r"><button data-act="Restart browser">Restart</button>
    <button data-act="Switch to Chrome">Use Chrome</button></div></div>
  <div class="panel"><header><b>Instance</b><span class="dim">Brave 1.98.60 · engine 156</span></header>
    <div class="c"><div class="kv"><dt>profile</dt><dd class="mono">spike/profile/brave · 124 MB</dd>
      <dt>devtools</dt><dd class="mono">127.0.0.1:9222</dd><dt>mode</dt><dd>headed under Xvfb :99</dd>
      <dt>your browser</dt><dd>never attached</dd></div></div></div>
  <div class="panel"><header><b>Session survival</b><span style="margin-left:auto;color:var(--green)">3 of 3 verified</span></header>
    <div class="c tight"><table><tbody>
      <tr><td>cookies_on_exit</td><td class="dim">logins survive a close</td><td><span class="tag" style="color:var(--green)">ok</span></td></tr>
      <tr><td>browsing_history_on_exit</td><td class="dim">history survives</td><td><span class="tag" style="color:var(--green)">ok</span></td></tr>
      <tr><td>restore_on_startup</td><td class="dim">continue where you left off</td><td><span class="tag" style="color:var(--green)">ok</span></td></tr>
    </tbody></table></div></div>`,
  `${asideHead('Why these three','')}
  <div style="padding:10px 12px;font-size:11.5px;line-height:1.6">
    <p style="margin:0 0 8px">The plan called this a “Forgetful Browsing” gate. Brave desktop 1.98.60 has no global switch by that name.</p>
    <p style="margin:0 0 8px">These are the preferences that actually decide whether a session outlives the window — read back through Brave's settings API, not assumed.</p>
    <div class="kv"><dt>checked</dt><dd>14:06, 1.1s</dd><dt>next</dt><dd>before every run</dd></div>
    <div style="margin-top:8px"><button class="p" data-act="Re-check now">Re-check now</button></div>
  </div>
  <div style="border-top:1px solid var(--line2)">${asideHead('Signed out','2 sites')}
    <div style="padding:10px 12px;font-size:11.5px">rekrute.com · linkedin.com<br>
      <button style="margin-top:6px" data-go="credentials">Open vault</button></div></div>`],

    <td><button data-act="Reveal ${c.site}">Reveal</button></td></tr>`).join('')}</tbody></table></div></div>

  `${asideHead('Merge rule','')}

}, render(id){ const [main, aside] = this.screens[id](); return shell(id, main, aside); } };
