<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Deck</title>
<style>
  :root{
    --bg:#15171a; --panel:#1c1f24; --panel2:#22262c; --ink:#e8eaed; --dim:#8b93a1;
    --line:#2b3037; --accent:#7aa2f7; --warn:#e0af68; --bad:#f7768e; --ok:#9ece6a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono)}
  a{color:var(--accent);text-decoration:none}
  .app{display:grid;grid-template-columns:54px 1fr;min-height:100vh}
  .rail{background:#101216;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px}
  .rail button{width:40px;height:34px;background:none;border:0;color:var(--dim);font:12px var(--mono);cursor:pointer;border-radius:4px}
  .rail button:hover{background:#1a1e24;color:var(--ink)}
  nav.rail button.is-active{background:#232a36;color:var(--accent)}
  .mnav{display:none}
  @media (max-width:760px){
    .mnav{display:flex;gap:2px;overflow:auto;padding:4px 6px;border-bottom:1px solid var(--line);background:#121417}
    .mnav::-webkit-scrollbar{display:none}
    .mnav button{background:none;border:1px solid transparent;color:var(--dim);font:11px var(--mono);
      padding:3px 8px;border-radius:3px;white-space:nowrap;cursor:pointer}
    .mnav button.is-active{color:var(--accent);border-color:#2b3d5e;background:#1a2028}
  }
  .rail .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin:6px 0 10px}
  .main{display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:#121417}
  .cmd{flex:1;display:flex;align-items:center;gap:8px;background:#0e1013;border:1px solid var(--line);border-radius:4px;padding:6px 10px;color:var(--dim);max-width:520px}
  .cmd kbd{background:#232830;border:1px solid #343b45;border-radius:3px;padding:1px 5px;color:#cdd3dd;font-size:11px}
  .hosts{display:flex;gap:8px;margin-left:auto}
  .host{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:11px;color:var(--dim)}
  .host b{color:var(--ink);font-weight:500}
  .g{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .y{background:var(--warn)}.r{background:var(--bad)}
  .wrap{padding:14px 16px 40px;overflow:auto}
  h1{font-size:15px;margin:0 0 12px;font-weight:600;letter-spacing:.02em}
  h1 span{color:var(--dim);font-weight:400}
  .grid{display:grid;gap:10px}
  .c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px}
  .panel > h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    margin:0;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:500}
  .body{padding:10px}
  .kpi{font-size:26px;line-height:1.1}
  .kpi small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:5px 8px;border-bottom:1px solid #23272e;vertical-align:top}
  tr:hover td{background:#1f242b}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:11px;color:var(--dim)}
  .chip.ok{color:var(--ok);border-color:#2f4a2c}
  .chip.warn{color:var(--warn);border-color:#4a3f28}
  .chip.bad{color:var(--bad);border-color:#4a2b31}
  .chip.acc{color:var(--accent);border-color:#2b3d5e}
  .row{display:flex;align-items:center;gap:8px}
  .btn{background:#242a33;border:1px solid #343c47;color:var(--ink);border-radius:3px;
    padding:4px 9px;font:11px var(--mono);cursor:pointer}
  .btn:hover{border-color:#4a5563}
  .btn.primary{background:#2a3f66;border-color:#3d5a8c;color:#cfe0ff}
  .btn.danger{background:#3a1f25;border-color:#63313a;color:#ffc9d2}
  .muted{color:var(--dim)}
  .log{font-size:12px;display:grid;grid-template-columns:64px 52px 70px 1fr;gap:8px;padding:3px 0;border-bottom:1px solid #1f242b}
  .log .t{color:var(--dim)}
  .lvl{font-size:10px;padding:0 4px;border-radius:2px;text-align:center;line-height:16px;height:16px;display:inline-block}
  .lvl.INFO{background:#1d2b22;color:var(--ok)}
  .lvl.WARN{background:#33291a;color:var(--warn)}
  .lvl.ERROR{background:#3a1f25;color:var(--bad)}
  .lvl.ALERT{background:#4a1d28;color:#ffb3c0;font-weight:700}
  .frozen{border:1px solid #63313a;background:#2a1a1e;border-radius:4px;padding:12px;margin-bottom:10px}
  .frozen h2{margin:0 0 6px;font-size:13px;color:#ffb3c0;letter-spacing:.06em;text-transform:uppercase}
  .shot{background:#0b0d10;border:1px dashed #3a3f48;border-radius:3px;height:150px;
    display:grid;place-items:center;color:#5b6270;font-size:11px;margin:8px 0}
  .form{display:flex;gap:8px;align-items:center}
  input[type=text]{background:#0e1013;border:1px solid #3a4048;color:var(--ink);
    padding:6px 8px;border-radius:3px;font:13px var(--mono);width:160px;letter-spacing:.25em}
  .hint{font-size:11px;color:var(--dim);display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:8px}
  .hint b{color:#c3cad6;font-weight:500}
  .bar2{height:6px;background:#0e1013;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
  .bar2 i{display:block;height:100%;background:var(--accent)}
  .steps{counter-reset:s;display:grid;gap:8px}
  .step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:3px;background:#191d22}
  .step b{display:block;font-weight:500}
  .step .no{color:var(--dim);font-size:11px}
  .phone{width:360px;margin:0 auto;background:#0b0d10;border:1px solid #3a4048;border-radius:18px;padding:10px}
  .phone .scr{background:var(--bg);border-radius:10px;overflow:hidden}
  .phone .hd{padding:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px}
  .phone .it{padding:10px;border-bottom:1px solid #23272e}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);text-align:center;font-size:10px;color:var(--dim)}
  .tabs div{padding:8px 0}
  .tabs .on{color:var(--accent)}
  .field{display:grid;gap:3px}
  .field label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .field input,.field select,.field textarea{background:#0e1013;border:1px solid #3a4048;color:var(--ink);
    padding:6px 8px;border-radius:3px;font:12.5px/1.45 var(--mono);width:100%;letter-spacing:normal;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #1d2b45}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .chip.acc b{cursor:pointer;margin-left:5px;color:var(--dim);font-weight:400}
  .chip.acc b:hover{color:var(--bad)}
  .chipin{background:#0e1013;border:1px dashed #3a4048;color:var(--ink);border-radius:3px;
    padding:2px 6px;font:11px var(--mono);width:160px}
  .chipin:focus{outline:none;border-color:var(--accent)}
  .drop{display:block;border:1px dashed #3a4048;border-radius:3px;background:#0b0d10;padding:14px 10px;
    text-align:center;color:var(--dim);cursor:pointer}
  .drop:hover{border-color:var(--accent);color:var(--ink)}
  .dirty{color:var(--warn)}
  .savebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .mock-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#232a33;
    border:1px solid #3b4450;color:#dfe4ec;padding:8px 12px;border-radius:4px;font:12px var(--mono);z-index:99}
  @media (max-width:760px){
    .c4,.c3,.c2{grid-template-columns:1fr 1fr}
    .app{grid-template-columns:1fr}
    .rail{display:none}
    .cmd{display:none}
    .bar{flex-wrap:wrap;gap:6px}
    .hosts{margin-left:0;flex-wrap:wrap}
    .phone{width:100%}
  }
  @media (max-width:560px){
    .c4,.c3,.c2{grid-template-columns:1fr}
    .f2{grid-template-columns:1fr}
    .savebar .muted{margin-left:0;width:100%}
    .log{grid-template-columns:58px 46px 1fr;row-gap:2px}
    .log > span:nth-child(3){display:none}
  }
</style></head><body>
<script src="../../shared/data.js"></script>
<script>
const D = window.JOBPILOT;
const host = (h) => `<span class="host"><i class="g ${h.state === 'green' ? '' : h.state === 'yellow' ? 'y' : 'r'}"></i><b>${h.id}</b> ${h.label}</span>`;
const navItems = [['dashboard','▚','Overview'],['jobs','≡','Jobs'],['job','▤','Job'],['triage','✓','Triage'],['verification','!','Verify'],['doctor','+','Doctor'],['logs','»','Logs'],['scope','◎','Scope'],['agent','◈','Browser'],['profile','◉','Profile'],['credentials','⌘','Vault'],['data','⇄','Data'],['onboarding','↦','Setup'],['pwa','▭','Phone'],['settings','⚙','Settings']];
const shell = (id, inner) => `
<div class="app">
  <nav class="rail" aria-label="sections">
    <div class="dot" title="browser session"></div>
    ${navItems.map(([k,g,label]) => `<button data-go="${k}" title="${label}" aria-label="${label}">${g}</button>`).join('')}
  </nav>
  <div class="main">
    <div class="bar">
      <div class="cmd"><span>⌘K</span><span>search jobs, agents, logs…</span><kbd>/</kbd></div>
      <div class="hosts">${D.hosts.map(host).join('')}<span class="host"><b>76</b> trust · caution</span></div>
    </div>
    <nav class="mnav" aria-label="sections">${navItems.map(([k,g,label])=>`<button data-go="${k}">${label}</button>`).join('')}</nav>
    <div class="wrap">${inner}</div>
  </div>
</div>`;

/* ---- profile data -------------------------------------------------------
   P0 keeps it in this browser so the form is actually usable. P1 replaces
   localStorage with the event log; the shape stays the same.              */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const P_DEFAULTS = {
  name: 'Yassine M.', headline: 'Service advisor · 2 years',
  email: 'yassine.m@example.com', phone: '+212 6 12 34 56 78',
  city: 'Casablanca', country: 'Morocco',
  links: 'linkedin.com/in/yassine-m',
  titles: ['Conseiller de service', 'Business développeur'],
  contract: 'CDI', seniority: 'Junior, 1–3 years',
  salary: '', remote: 'Hybrid ok',
  languages: 'French, English, Arabic',
  resumeFile: 'resume-v4.pdf', resumeSize: '184 KB',
};
const pLoad = () => {
  try { return { ...P_DEFAULTS, ...JSON.parse(localStorage.getItem('jobpilot.profile') || '{}') }; }
  catch { return { ...P_DEFAULTS }; }
};
window.P = pLoad();
const P = window.P;
let pDirty = false;

const flash = (msg) => {
  document.querySelectorAll('.mock-toast').forEach((n) => n.remove());
  const el = document.createElement('div');
  el.className = 'mock-toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
};
const markDirty = () => {
  pDirty = true;
  const n = document.getElementById('save-state');
  if (n) { n.textContent = 'unsaved changes'; n.className = 'muted dirty'; }
};
const field = (k, label, val, ph = '') => `<div class="field"><label for="p-${k}">${label}</label>
  <input id="p-${k}" type="text" value="${esc(val)}" placeholder="${esc(ph)}" oninput="setField('${k}',this.value)"></div>`;
const area = (k, label, val) => `<div class="field"><label for="p-${k}">${label}</label>
  <textarea id="p-${k}" rows="2" oninput="setField('${k}',this.value)">${esc(val)}</textarea></div>`;
const select = (k, label, opts, val) => `<div class="field"><label for="p-${k}">${label}</label>
  <select id="p-${k}" onchange="setField('${k}',this.value)">${opts.map((o) => `<option${o === val ? ' selected' : ''}>${o}</option>`).join('')}</select></div>`;
const rolesHtml = () => P.titles.map((t, i) => `<span class="chip acc">${esc(t)}<b onclick="dropRole(${i})" title="remove">×</b></span>`).join('');

window.setField = (k, v) => { P[k] = v; markDirty(); };
window.saveProfile = () => {
  try { localStorage.setItem('jobpilot.profile', JSON.stringify(P)); } catch { /* private mode */ }
  pDirty = false;
  const n = document.getElementById('save-state');
  if (n) { n.textContent = 'saved in this browser · P1 writes it to the local database'; n.className = 'muted'; }
  flash('profile saved');
};
window.revertProfile = () => location.reload();
window.resetProfile = () => {
  if (!confirm('Reset every field to the starting values?')) return;
  try { localStorage.removeItem('jobpilot.profile'); } catch { /* ignore */ }
  location.reload();
};
window.exportProfile = () => {
  const blob = new Blob([JSON.stringify(P, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jobpilot-profile.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
window.addRole = (inp) => {
  const v = inp.value.trim();
  if (!v) return;
  P.titles.push(v);
  inp.value = '';
  document.getElementById('roles').innerHTML = rolesHtml();
  markDirty();
};
window.dropRole = (i) => {
  P.titles.splice(i, 1);
  document.getElementById('roles').innerHTML = rolesHtml();
  markDirty();
};
window.setResume = (inp) => {
  const f = inp.files && inp.files[0];
  if (!f) return;
  P.resumeFile = f.name;
  P.resumeSize = `${Math.max(1, Math.round(f.size / 1024))} KB`;
  document.getElementById('resume-meta').innerHTML = `${esc(P.resumeFile)} · ${esc(P.resumeSize)}`;
  markDirty();
};

const kpi = (n, label, tone='') => `<div class="panel"><div class="body"><div class="kpi" style="${tone}">${n}<small>${label}</small></div></div></div>`;

window.VARIANT = { id:'01-command-deck', name:'Command Deck', screens:{
dashboard: () => `
  <h1>Overview <span>· run 41 on PC · started 14:02</span></h1>
  <div class="grid c4" style="margin-bottom:10px">
    ${kpi('3','ready to approve')}${kpi('2','need a decision','color:var(--warn)')}${kpi('1','frozen · verification','color:var(--bad)')}${kpi('6','new today')}
  </div>
  <div class="grid c2">
    <div class="panel">
      <h2>Now running</h2>
      <div class="body">
        <div class="row"><span class="chip acc">DISCOVERING</span><b>rekrute.com</b><span class="muted">${D.run.page}</span></div>
        <div style="margin:8px 0 6px" class="muted">${D.run.action} · host ${D.run.host} · ${D.run.elapsed} elapsed</div>
        <div class="bar2"><i style="width:62%"></i></div>
        <div class="row" style="margin-top:10px">
          <button class="btn danger" data-act="Pause all agents">Pause all agents</button>
          <button class="btn" data-act="Open live browser">Open live browser</button>
          <span class="muted" style="margin-left:auto">last push 4m ago</span>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>Verification waiting</h2>
      <div class="body">
        <div class="frozen" style="margin:0">
          <h2>frozen 2m 10s · PC</h2>
          <div>rekrute.com — security challenge</div>
          <div class="muted" style="font-size:11px;margin:4px 0 8px">${D.verification.url}</div>
          <button class="btn primary" data-go="verification">Take control</button>
        </div>
      </div>
    </div>
    <div class="panel" style="grid-column:1/-1">
      <h2>Log tail</h2>
      <div class="body">${D.logs.slice(0,6).map(l=>`<div class="log"><span class="t">${l.t}</span><span class="lvl ${l.lvl}">${l.lvl}</span><span class="muted">${l.agent}</span><span>${l.msg}</span></div>`).join('')}
      <div style="margin-top:8px"><button class="btn" data-go="logs">All logs</button></div></div>
    </div>
  </div>`,

jobs: () => `
  <h1>Jobs <span>· 7 after filters · 2 low signal hidden</span></h1>
  <div class="panel">
    <div class="body row" style="border-bottom:1px solid var(--line)">
      <span class="chip">country: Morocco ×</span><span class="chip">city: Casablanca, Rabat ×</span><span class="chip">type: internship + full-time ×</span>
      <span class="muted" style="margin-left:auto">grouped by location</span>
    </div>
    <table>
      <thead><tr><th>Title</th><th>Company</th><th>City</th><th>Source</th><th>Salary</th><th>Signal</th><th></th></tr></thead>
      <tbody>
      ${D.jobs.filter(j=>j.signal!=='low').map(j=>`<tr>
        <td>${j.title}</td><td class="muted">${j.company}</td><td>${j.city}</td>
        <td class="muted">${j.source}</td><td>${j.salary ?? '—'}</td>
        <td><span class="chip ${j.signal==='high'?'ok':'warn'}">${j.signal}</span></td>
        <td><button class="btn" data-go="job">Open</button></td></tr>`).join('')}
      </tbody>
    </table>
    <div class="body"><button class="btn" data-act="Show 2 low-signal listings">Show low signal (2)</button></div>
  </div>`,

triage: () => `
  <h1>Triage <span>· 3 ready · 2 need you · 2 skipped</span></h1>
  <div class="row" style="margin-bottom:10px">
    <button class="btn primary" data-act="Approve top 3">Approve top 3</button>
    <button class="btn" data-act="Snooze rest">Snooze rest</button>
    <span class="muted" style="margin-left:auto">sorted by match × honesty fit</span>
  </div>
  ${[['Ready',D.triage.ready,'ok'],['Needs you',D.triage.needsYou,'warn'],['Skip pile',D.triage.skip,'bad']].map(([label,list,tone])=>`
  <div class="panel" style="margin-bottom:10px">
    <h2>${label} · ${list.length}</h2>
    <table><tbody>${list.map(j=>`<tr>
      <td style="width:44%"><b>${j.title}</b><div class="muted" style="font-size:11px">${j.company} · ${j.city}</div></td>
      <td><span class="chip">${j.type}</span></td>
      <td class="muted">${j.source}</td>
      <td>${j.score}</td>
      <td class="muted" style="font-size:11px">${j.honesty}</td>
      <td><button class="btn" data-act="Preview ${j.title}">Preview</button></td></tr>`).join('')}</tbody></table>
  </div>`).join('')}`,

verification: () => `
  <h1>Verification <span>· agent frozen, nothing else is running</span></h1>
  <div class="frozen">
    <h2>security challenge · rekrute.com · host PC · 2m 10s</h2>
    <div class="muted" style="font-size:11px">${D.verification.url}<br>${D.verification.run}</div>
    <div class="shot">screenshot of the paused tab (value-redacted)</div>
    <div class="form">
      <input type="text" placeholder="000000" aria-label="one-time code">
      <button class="btn primary" data-act="Submit code and resume">Submit and resume</button>
      <button class="btn" data-go="pwa">Take control</button>
    </div>
    <div class="hint">
      <b>went to</b><span>${D.verification.guidance.account}</span>
      <b>search</b><span>${D.verification.guidance.search}</span>
      <b>phone</b><span>${D.verification.guidance.phone}</span>
      <b>valid</b><span>${D.verification.guidance.validFor}</span>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" data-act="I finished in the browser — resume">I finished — resume</button>
      <button class="btn danger" data-act="Abandon run">Abandon run</button>
      <span class="muted" style="margin-left:auto">never auto-continues</span>
    </div>
  </div>
  <div class="panel"><h2>History</h2><div class="body muted">
    today 14:04 · rekrute.com · challenge · resolved in 41s (PC)<br>
    yesterday 09:12 · linkedin.com · email OTP · resolved in 1m 20s (PC)
  </div></div>`,

doctor: () => `
  <h1>Doctor <span>· 11 pass · 2 warn · 2 fail</span></h1>
  <div class="grid c2" style="margin-bottom:10px">
    <div class="panel"><div class="body row" style="gap:16px">
      <div class="kpi" style="font-size:38px;color:var(--warn)">76<small>/100 trust score · caution</small></div>
      <div class="muted" style="font-size:11px">estimate, not a guarantee.<br>bans are always possible.</div>
    </div></div>
    <div class="panel"><div class="body">
      <div class="row"><span class="chip bad">FAIL</span> no WebGL context <span class="muted" style="margin-left:auto">−8</span></div>
      <div class="row" style="margin-top:4px"><span class="chip bad">FAIL</span> timezone UTC vs IP Berlin <span class="muted" style="margin-left:auto">−9</span></div>
      <div class="muted" style="font-size:11px;margin-top:8px">Both are fixable. Run anyway is logged.</div>
    </div></div>
  </div>
  <div class="panel"><h2>Checks</h2><table>
    <thead><tr><th>State</th><th>Check</th><th>Why it matters</th><th>Fix</th></tr></thead>
    <tbody>${D.doctor.map(c=>`<tr>
      <td><span class="chip ${c.state==='PASS'?'ok':c.state==='WARN'?'warn':'bad'}">${c.state}</span></td>
