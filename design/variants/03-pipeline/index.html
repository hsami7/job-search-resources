<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#0f172a; --dim:#64748b; --line:#e2e8f0;
    --violet:#7c3aed; --violet-wash:#f3eefe; --green:#0f9d58; --amber:#d97706; --red:#dc2626;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}
  .brand{font-weight:700;letter-spacing:-.02em}
  .brand i{color:var(--violet);font-style:normal}
  .tabs{display:flex;gap:2px;margin-left:6px;flex-wrap:wrap}
  .tabs a{padding:6px 11px;border-radius:8px;color:var(--dim);font-size:13.5px}
  .tabs a:hover{background:#f1f5f9;color:var(--ink)}
  .tabs a.is-active{background:var(--violet-wash);color:var(--violet);font-weight:600}
  .pills{margin-left:auto;display:flex;gap:6px}
  .pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim);background:#fff}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .dot.y{background:var(--amber)}
  main{padding:18px 18px 60px}
  .stages{display:flex;gap:10px;margin-bottom:16px;overflow:auto;padding-bottom:2px}
  .stage{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .stage b{display:block;font-size:11.5px;letter-spacing:.03em;color:var(--dim);font-weight:600}
  .stage span{font-size:22px;font-variant-numeric:tabular-nums}
  .stage.on{border-color:#c4b5fd;background:var(--violet-wash)}
  .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start}
  .col{background:#eef1f7;border-radius:var(--radius);padding:8px}
  .col > h2{margin:2px 6px 8px;font-size:12.5px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);border-left:3px solid var(--violet)}
  .card.high{border-left-color:var(--green)} .card.warn{border-left-color:var(--amber)} .card.low{border-left-color:var(--red)}
  .card h3{margin:0 0 2px;font-size:14px;line-height:1.35}
  .card .meta{font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .card .act{display:flex;gap:6px;flex-wrap:wrap}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--dim);background:#fafbfd}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:4px 10px;font-size:12.5px;color:var(--ink)}
  button:hover{border-color:#cbd5e1}
  button.primary{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
  button.danger{color:var(--red);border-color:#fecaca;background:#fff5f5}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .panel h2{margin:0 0 10px;font-size:13px;text-transform:none;color:var(--dim);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid #f1f5f9}
  .badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600}
  .badge.ok{background:#e7f6ee;color:#0b6b3d}.badge.warn{background:#fef3e2;color:#96500a}.badge.bad{background:#fdeaea;color:#b91c1c}
  .frozen{border:2px solid #fecaca;background:#fff5f5;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .frozen h2{margin:0 0 4px;font-size:15px;color:#b91c1c}
  .shot{height:130px;border:1px dashed #e2c4c4;border-radius:8px;display:grid;place-items:center;color:#a97b7b;font-size:12px;margin:10px 0;background:#fff}
  input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:14px ui-monospace,Menlo,monospace;letter-spacing:.25em;width:150px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat small{display:block;font-size:12px;color:var(--dim);font-weight:400}
  .phone{width:352px;margin:0 auto;background:#0f172a;border-radius:26px;padding:9px}
  .phone .scr{background:var(--bg);border-radius:18px;overflow:hidden}
  .phone .hd{padding:11px 13px;display:flex;justify-content:space-between;font-size:12.5px;border-bottom:1px solid var(--line);background:#fff}
  .phone .it{padding:12px 13px;border-bottom:1px solid var(--line);background:#fff}
  .phone .tabs2{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--dim);text-align:center}
  .phone .tabs2 div{padding:9px 0}.phone .tabs2 .on{color:var(--violet);font-weight:600}
  .mock-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;
    padding:8px 14px;border-radius:999px;font-size:12.5px;z-index:99}
  @media(max-width:980px){.board{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
  @media(max-width:640px){
    .board{grid-template-columns:1fr}
    .top{display:block;padding:9px 12px}
    .tabs{display:flex;overflow:auto;margin:8px 0 0;width:100%}
    .tabs::-webkit-scrollbar{display:none}
    .tabs a{white-space:nowrap}
    .pills{display:none}
    .phone{width:100%}
  }
</style></head><body>
<script src="../../shared/data.js"></script>
<script>
const D = window.JOBPILOT;
const tabs=[['dashboard','Board'],['jobs','Listings'],['job','Job'],['triage','Approval'],['verification','Verification'],['doctor','Doctor'],['logs','Logs'],['scope','Scope'],['agent','Browser'],['credentials','Vault'],['data','Data'],['onboarding','Setup'],['pwa','Phone'],['settings','Settings']];
const shell=(id,inner)=>`
<div class="top">
  <div class="brand">job<i>Pilot</i></div>
  <div class="tabs">${tabs.map(([k,l])=>`<a href="#${k}" data-go="${k}">${l}</a>`).join('')}</div>
  <div class="pills">${D.hosts.map(h=>`<span class="pill"><i class="dot ${h.state==='green'?'':'y'}"></i>${h.id} ${h.label}</span>`).join('')}
    <span class="pill">trust ${D.trust.score}</span></div>
</div>
<main>${inner}</main>`;

const card=(j,tone)=>`<div class="card ${tone}"><h3>${j.title}</h3>
  <div class="meta"><span>${j.company ?? 'no employer'}</span><span>·</span><span>${j.city}</span>
    <span class="tag">${j.type ?? ''}</span></div>
  <div class="act"><button class="primary" data-act="Open ${j.title}">Open</button>
    <button data-act="Preview ${j.title}">Preview</button></div></div>`;

window.VARIANT={id:'03-pipeline',name:'Pipeline',screens:{
dashboard:()=>`
  <div class="stages">
    <div class="stage"><b>Discovered</b><span>7</span></div>
    <div class="stage"><b>Tailored</b><span>5</span></div>
    <div class="stage"><b>Reviewed</b><span>3</span></div>
    <div class="stage on"><b>Awaiting approval</b><span>5</span></div>
    <div class="stage"><b>Submitted</b><span>0</span></div>
  </div>
  ${D.triage.ready.length?`<div class="board">
    <div class="col"><h2>In discovery <span>2</span></h2>
      ${D.jobs.slice(2,4).map(j=>card(j,'')).join('')}</div>
    <div class="col"><h2>Tailored <span>2</span></h2>
      ${D.triage.needsYou.map(j=>card(j,'warn')).join('')}</div>
    <div class="col"><h2>Ready for you <span>3</span></h2>
      ${D.triage.ready.map(j=>card(j,'high')).join('')}</div>
    <div class="col"><h2>Set aside <span>2</span></h2>
      ${D.triage.skip.map(j=>card(j,'low')).join('')}</div>
  </div>`:''}
  <div class="panel" style="margin-top:14px;border-color:#fecaca">
    <h2 style="color:#b91c1c">Blocked · verification on rekrute.com</h2>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span>Security challenge on the ${D.verification.host}, ${D.verification.age}. The agent is frozen; the board will not move until you resolve it.</span>
      <button class="primary" data-go="verification" style="margin-left:auto">Resolve</button>
    </div>
  </div>`,

jobs:()=>`
  <div class="panel"><h2>Listings · 7 shown, 2 low signal hidden</h2>
  <table><tr><th>Title</th><th>Employer</th><th>City</th><th>Source</th><th>Pay</th><th></th></tr>
  ${D.jobs.filter(j=>j.signal!=='low').map(j=>`<tr><td>${j.title}</td><td>${j.company}</td><td>${j.city}</td>
    <td style="color:var(--dim)">${j.source}</td><td>${j.salary??'—'}</td>
    <td><button data-go="job">Open</button></td></tr>`).join('')}</table>
  <div style="margin-top:10px"><button data-act="Show low signal">Show 2 hidden</button></div></div>`,

triage:()=>`
  <div class="panel"><h2>Awaiting approval · nothing sends without your submit</h2>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="primary" data-act="Approve top 3">Approve top 3</button>
    <button data-act="Snooze rest">Snooze the rest</button></div>
  <div class="board">
    <div class="col"><h2>Ready <span>${D.triage.ready.length}</span></h2>${D.triage.ready.map(j=>card(j,'high')).join('')}</div>
    <div class="col"><h2>Needs you <span>${D.triage.needsYou.length}</span></h2>${D.triage.needsYou.map(j=>card(j,'warn')).join('')}</div>
    <div class="col"><h2>Skipped <span>${D.triage.skip.length}</span></h2>${D.triage.skip.map(j=>card(j,'low')).join('')}</div>
    <div class="col"><h2>Submitted <span>0</span></h2><div class="card" style="border-left-color:var(--line);color:var(--dim)">Nothing submitted yet. Prefill opens the real form; you press send.</div></div>
  </div></div>`,

verification:()=>`
  <div class="frozen"><h2>Frozen · security challenge · rekrute.com · ${D.verification.host}</h2>
  <div style="color:#7f1d1d;font-size:13px;word-break:break-all">${D.verification.url}</div>
  <div class="shot">paused tab · screenshot</div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <input type="text" placeholder="000000" aria-label="code">
    <button class="primary" data-act="Submit and resume">Submit and resume</button>
    <button data-go="pwa">Take control</button>
    <button data-act="Abandon run" class="danger">Abandon</button>
  </div>
  <div class="grid2" style="margin-top:12px">
    <div class="panel" style="margin:0"><h2>Where the code went</h2>
      <div style="font-size:13px">${D.verification.guidance.account}<br>
      search <code>${D.verification.guidance.search}</code><br>
      phone ${D.verification.guidance.phone}<br>valid ${D.verification.guidance.validFor}</div></div>
    <div class="panel" style="margin:0"><h2>Run context</h2>
      <div style="font-size:13px">${D.verification.run}<br>detected ${D.verification.at}<br>
      push delivered in 1.4 s<br>no timeout auto-continue</div></div>
  </div></div>
  <div class="panel"><h2>History</h2><table><tr><th>When</th><th>Site</th><th>Type</th><th>Host</th><th>Resolved</th></tr>
    <tr><td>today 14:04</td><td>rekrute.com</td><td>security challenge</td><td>PC</td><td>open</td></tr>
    <tr><td>yesterday 09:12</td><td>linkedin.com</td><td>email OTP</td><td>PC</td><td>1m 20s</td></tr></table></div>`,

doctor:()=>`
  <div class="grid2">
    <div class="panel"><h2>Trust score</h2>
      <div class="stat" style="color:var(--amber)">${D.trust.score}<small>/100 · ${D.trust.band.toLowerCase()} · estimate, not a guarantee</small></div>
      <div style="margin-top:10px">${D.trust.signals.filter(s=>s.state!=='PASS').map(s=>`<div style="font-size:13px;margin-bottom:6px"><span class="badge bad">${s.state}</span> ${s.name}<div style="color:var(--dim);font-size:12px">${s.fix}</div></div>`).join('')}</div></div>
    <div class="panel"><h2>Environment</h2>
      <div class="stat">11<small>passing checks</small></div>
      <div style="margin-top:8px"><span class="badge warn">2 WARN</span> <span class="badge bad">2 FAIL</span></div>
      <div style="margin-top:10px;display:flex;gap:6px"><button data-act="Re-run checks">Re-run</button>
      <button class="danger" data-act="Run anyway (logged)">Run anyway</button></div></div>
  </div>
  <div class="panel"><h2>All checks</h2><table><tr><th>Check</th><th>State</th><th>Why</th><th>Fix</th></tr>
  ${D.doctor.map(c=>`<tr><td>${c.name}</td>
    <td><span class="badge ${c.state==='PASS'?'ok':c.state==='WARN'?'warn':'bad'}">${c.state}</span></td>
    <td style="color:var(--dim)">${c.why}</td>
    <td>${c.fix?`<button data-act="${c.fix}">Fix</button>`:'—'}</td></tr>`).join('')}</table></div>`,

logs:()=>`
  <div class="panel"><h2>Run 41 · live tail · 30-day retention</h2>
  <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    <span class="badge ok">INFO</span><span class="badge warn">WARN</span><span class="badge bad">ERROR</span>
    <button data-act="Filter by agent">Agent</button><button data-act="Filter by site">Site</button>
    <button data-act="Export diagnostic bundle" style="margin-left:auto">Export bundle</button></div>
  <table>${D.logs.map(l=>`<tr><td style="width:62px;color:var(--dim)">${l.t}</td>
    <td style="width:56px"><span class="badge ${l.lvl==='INFO'?'ok':l.lvl==='WARN'?'warn':'bad'}">${l.lvl}</span></td>
    <td style="width:70px;color:var(--dim)">${l.agent}</td><td>${l.msg}</td>
    <td style="width:56px;color:var(--dim)">${l.dur}</td></tr>`).join('')}</table>
  <div style="margin-top:10px"><button data-act="Explain last error">Explain last error</button></div></div>`,

scope:()=>`
  <div class="panel"><h2>Sites · mode decides how each one is read</h2>
  <table><tr><th>Site</th><th>Mode</th><th>State</th><th>Last scan</th><th>Found</th><th></th></tr>
  ${D.sites.map(s=>`<tr><td>${s.host}</td><td><span class="tag">${s.mode}</span></td>
    <td><span class="badge ${s.state==='working'?'ok':s.state==='planned'?'warn':''}">${s.state}</span></td>
    <td style="color:var(--dim)">${s.lastScan}</td><td>${s.found}</td>
    <td><button data-act="Edit ${s.host}">Edit</button></td></tr>`).join('')}</table>
  <div style="margin-top:10px;color:var(--dim);font-size:12.5px">No adapter and no structured data means paste a URL. No crawling.</div></div>
  <div class="panel"><h2>Locations</h2>${D.locations.map(l=>`<div style="margin-bottom:8px">
    <strong>${l.country}</strong> ${l.cities.map(c=>`<span class="tag">${c}</span>`).join(' ')}
    <span style="color:var(--dim);font-size:12px">${l.count} found</span></div>`).join('')}
  <button data-act="Add location">Add location</button></div>`,

agent:()=>`
  <div class="grid2">
    <div class="panel"><h2>Browser</h2>
      <div style="font-size:13px;line-height:1.9">Brave 1.98.60 · engine 156<br>
      profile <span class="tag">spike/profile/brave</span><br>CDP 127.0.0.1:9222 · headed</div>
      <div style="margin-top:10px;display:flex;gap:6px"><button data-act="Restart browser">Restart</button>
      <button data-act="Switch to Chrome">Chrome instead</button></div></div>
    <div class="panel"><h2>Logins survive restart</h2>
      <div style="font-size:13px">Brave desktop has no single keep-cookies switch. These are the settings that matter:</div>
      <div style="margin-top:8px;font-size:13px">
        <div><span class="badge ok">PASS</span> cookies survive close</div>
        <div><span class="badge ok">PASS</span> history survives close</div>
        <div><span class="badge ok">PASS</span> continue where you left off</div></div>
      <div style="margin-top:10px"><button class="primary" data-act="Re-check now">Verify again</button></div></div>
  </div>
  <div class="panel"><h2>Logged out</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="badge bad">rekrute.com</span><span class="badge bad">linkedin.com</span>
      <button style="margin-left:auto" data-go="credentials">Open vault</button></div></div>`,

credentials:()=>`
  <div class="panel"><h2>Vault · encrypted per site, never sent to a model</h2>
  <table><tr><th>Site</th><th>Account</th><th>Held</th><th>Last used</th><th>Uses</th><th></th></tr>
  ${D.credentials.map(c=>`<tr><td>${c.site}</td><td>${c.user}</td><td style="color:var(--dim)">${c.kind}</td>
    <td style="color:var(--dim)">${c.lastUsed}</td><td>${c.uses}</td>
    <td><button data-act="Reveal ${c.site}">Reveal</button></td></tr>`).join('')}</table>
  <div style="margin-top:10px"><button data-act="Lock vault">Lock vault</button></div></div>
  <div class="panel"><h2>Audit</h2><table>
    <tr><td style="width:62px;color:var(--dim)">14:04</td><td>filled the rekrute.com form during run 41</td></tr>
    <tr><td style="color:var(--dim)">13:58</td><td>revealed marocannonces.com after the passphrase</td></tr></table></div>`,

data:()=>`
  <div class="grid2">${D.hosts.map(h=>`<div class="panel"><h2>${h.id} · ${h.label}</h2>
    <div class="stat">${h.events}<small>events · ${h.db} · heartbeat ${h.heartbeat}</small></div>
    <div style="color:var(--dim);font-size:12.5px;margin-top:4px">last backup ${h.lastBackup}</div></div>`).join('')}</div>
  <div class="panel"><h2>Backup</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="badge ok">${D.backup.state.toUpperCase()}</span><span>${D.backup.lastBackup} · ${D.backup.size}</span>
    <span style="color:var(--dim);font-size:12.5px">${D.backup.hash}</span>
    <button class="primary" style="margin-left:auto" data-act="Back up now">Back up now</button></div>
    <div style="color:var(--dim);font-size:12.5px;margin-top:8px">${D.backup.note}</div></div>
  <div class="panel"><h2>Your data</h2><div style="display:flex;gap:8px;flex-wrap:wrap">
    <button data-act="Export everything">Export everything</button>
    <button class="danger" data-act="Delete everything on this PC">Delete on this PC</button></div></div>`,

onboarding:()=>`
  <div class="panel"><h2>Setup · 3 of 5 done</h2>
  <div style="display:grid;gap:8px">
  ${[['OpenRouter key','valid · claude-haiku default · 412 credits','ok'],
     ['Resume','v4 parsed · 82% fit · 3 fields to confirm','ok'],
     ['Type and places','internships + full-time · Casablanca, Rabat, Remote','ok'],
     ['Browser check','Brave found · confirm logins survive restart','warn'],
     ['Risk acknowledgement','bans are possible; nothing sends without your click','']]
   .map(([t,s,b],i)=>`<div style="display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px">
     <span class="dot ${b==='ok'?'':b==='warn'?'y':''}" style="${b?'':'background:#cbd5e1'}"></span>
     <div><b style="font-size:13.5px">${t}</b><div style="color:var(--dim);font-size:12.5px">${s}</div></div>
     <button style="margin-left:auto" data-act="Open step ${i+1}">${i<3?'Review':b?'Open':'Acknowledge'}</button></div>`).join('')}
  </div>
  <div style="margin-top:12px"><button class="primary" data-act="Run first scan">Run first scan</button></div></div>`,

pwa:()=>`
  <div class="phone"><div class="scr">
    <div class="hd"><span><i class="dot"></i> PC saved</span><span style="color:var(--dim)">76</span></div>
    <div class="it" style="background:#fff5f5">
      <b style="color:#b91c1c;font-size:13.5px">Frozen · rekrute.com</b>
      <div style="color:var(--dim);font-size:12.5px">security challenge · 2m ago</div>
      <div style="display:flex;gap:6px;margin-top:8px"><button class="primary" data-go="verification">Take control</button>
      <button data-act="Enter code">Code</button></div></div>
    <div class="it"><b style="font-size:13.5px">Conseiller de service</b>
      <div style="color:var(--dim);font-size:12.5px">Auto Hall · Casablanca · 88</div>
      <div style="display:flex;gap:6px;margin-top:8px"><button class="primary" data-act="Approve">Approve</button>
      <button data-act="Skip">Skip</button></div></div>
    <div class="it"><b style="font-size:13.5px">Business développeur</b>
      <div style="color:var(--dim);font-size:12.5px">Alten Maroc · Rabat · 84</div>
      <div style="display:flex;gap:6px;margin-top:8px"><button class="primary" data-act="Approve">Approve</button>
      <button data-act="Skip">Skip</button></div></div>
    <div class="tabs2"><div class="on">Approval</div><div>Board</div><div>Doctor</div><div>Run</div></div>
  </div></div>`,
job: () => `
