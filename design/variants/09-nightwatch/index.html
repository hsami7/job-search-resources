<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightwatch</title>
<style>
  :root{
    --bg:#0e1116; --panel:#141a21; --panel2:#182029; --ink:#e6edf3; --dim:#8b949e;
    --line:rgba(240,246,252,.09); --line2:rgba(240,246,252,.06);
    --blue:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149; --violet:#a371f7;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(900px 420px at 15% -10%, rgba(88,166,255,.18), transparent 60%),
      radial-gradient(700px 400px at 95% 0%, rgba(163,113,247,.12), transparent 60%),
      var(--bg);
    color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh;padding-bottom:40px}
  a{color:inherit;text-decoration:none}
  .navwrap{position:sticky;top:0;z-index:7;padding:12px 16px;display:flex;justify-content:center;
    background:linear-gradient(180deg,rgba(14,17,22,.95),rgba(14,17,22,.6));backdrop-filter:blur(10px)}
  .seg{display:flex;gap:2px;background:rgba(22,28,35,.9);border:1px solid var(--line);border-radius:999px;
    padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.4);overflow:auto;max-width:100%}
  .seg a{padding:6px 13px;border-radius:999px;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .seg a:hover{color:var(--ink)}
  .seg::-webkit-scrollbar{display:none}
  .seg{scrollbar-width:none}
  .seg a.is-active{background:rgba(88,166,255,.16);color:#cfe6ff;box-shadow:inset 0 0 0 1px rgba(88,166,255,.35)}
  .wrap{max-width:1160px;margin:0 auto;padding:18px 16px 0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
  .wrap.wide{grid-template-columns:minmax(0,1fr)}
  h1{font-size:22px;letter-spacing:-.02em;margin:0 0 2px;font-weight:600}
  .sub{color:var(--dim);margin:0 0 16px;font-size:13.5px}
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;inset:auto -20% -60% auto;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle,rgba(88,166,255,.12),transparent 70%)}
  .stat .k{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
  .stat .v{font-size:38px;line-height:1.05;letter-spacing:-.035em;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .d{font-size:11.5px;color:var(--dim)}
  .stat.red .v{color:var(--red)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:8px}
  .card h2 .r{margin-left:auto;font-weight:400;color:var(--dim);font-size:11.5px}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(63,185,80,.14)}
  .pulse.red{background:var(--red);box-shadow:0 0 0 4px rgba(248,81,73,.14)}
  .pulse.amber{background:var(--amber);box-shadow:0 0 0 4px rgba(210,153,34,.14)}
  .runline{display:flex;align-items:center;gap:10px;font-size:13px}
  .runline b{font-weight:600}
  .track{height:6px;border-radius:99px;background:#0b0e12;border:1px solid var(--line2);overflow:hidden;margin:10px 0 8px}
  .track i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:rgba(240,246,252,.06);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:6px 11px;font:12.5px var(--sans);cursor:pointer}
  .btn:hover{background:rgba(240,246,252,.1)}
  .btn.p{background:#1f6feb;border-color:#388bfd;color:#fff}
  .btn.p:hover{background:#2a7aef}
  .btn.d{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.35);color:#ffb4b0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
  .item:last-child{border-bottom:0}
  .score{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:600;
    background:rgba(63,185,80,.12);color:#7ee2a8;font-size:14px}
  .score.w{background:rgba(210,153,34,.12);color:#e3b341}
  .score.r{background:rgba(248,81,73,.12);color:#ffa198}
  .t{font-weight:600;font-size:14px;line-height:1.35}
  .m{font-size:12px;color:var(--dim)}
  .tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
    padding:1px 8px;font-size:11px;color:var(--dim);background:rgba(240,246,252,.03)}
  .tag.g{color:#7ee2a8;border-color:rgba(63,185,80,.3);background:rgba(63,185,80,.08)}
  .tag.a{color:#e3b341;border-color:rgba(210,153,34,.3);background:rgba(210,153,34,.08)}
  .tag.r{color:#ffa198;border-color:rgba(248,81,73,.32);background:rgba(248,81,73,.08)}
  .tag.b{color:#9ecbff;border-color:rgba(88,166,255,.3);background:rgba(88,166,255,.08)}
  .drawer{background:linear-gradient(180deg,rgba(24,32,41,.95),rgba(20,26,33,.95));
    border:1px solid var(--line);border-radius:16px;padding:14px 15px;height:fit-content;
    box-shadow:0 20px 50px rgba(0,0,0,.35);backdrop-filter:blur(8px);position:sticky;top:66px}
  .drawer h3{margin:0 0 2px;font-size:14px}
  .drawer .m{margin-bottom:12px}
  .dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;margin:0}
  .dl dt{color:var(--dim)}.dl dd{margin:0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.03em;border-bottom:1px solid var(--line);
    padding:5px 7px}
  td{padding:6px 7px;border-bottom:1px solid var(--line2);vertical-align:top}
  tbody tr:hover td{background:rgba(240,246,252,.03)}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
  .shot{border:1px dashed rgba(248,81,73,.35);border-radius:10px;height:140px;display:grid;place-items:center;
    color:#b07a7a;font-size:12px;margin:10px 0;background:rgba(248,81,73,.04)}
  input.code{font:16px ui-monospace,Menlo,monospace;letter-spacing:.4em;width:150px;padding:7px 10px;
    border-radius:9px;border:1px solid var(--line);background:#0b0e12;color:var(--ink);text-align:center}
  .alert{border:1px solid rgba(248,81,73,.28);background:rgba(248,81,73,.07);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .alert h2{color:#ffa198;margin:0 0 4px;font-size:14px}
  .alert p{margin:0;font-size:12.5px;color:#d8a6a3}
  .phone{width:310px;margin:0 auto;border:1px solid var(--line);border-radius:26px;background:#0b0e12;padding:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .phone .scr{border-radius:19px;overflow:hidden;background:#0e1116;border:1px solid var(--line2)}
  .phone .hd{padding:10px 12px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between;
    border-bottom:1px solid var(--line2)}
  .phone .it{padding:11px 12px;border-bottom:1px solid var(--line2)}
  .phone .tabs{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:10px;color:var(--dim);padding:8px 0 10px}
  .phone .tabs .on{color:var(--blue)}
  .mock-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f6feb;color:#fff;
    padding:7px 13px;border-radius:999px;font-size:12.5px;z-index:99;box-shadow:0 10px 30px rgba(31,111,235,.4)}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}.drawer{position:static}}
  @media(max-width:760px){
    .hero{grid-template-columns:1fr 1fr}
    .grid2,.grid3{grid-template-columns:1fr}
    .seg a{padding:5px 10px;font-size:11.5px}
    .phone{width:100%}
  }
</style></head><body>
<script src="../../shared/data.js"></script>
<script>
const D = window.JOBPILOT;
const nav = [['dashboard','Today'],['jobs','Jobs'],['job','Job'],['triage','Approve'],['verification','Verify'],
  ['doctor','Health'],['logs','Activity'],['scope','Sites'],['agent','Browser'],
  ['credentials','Vault'],['data','Sync'],['onboarding','Setup'],['pwa','Phone'],['settings','Settings']];

const shell = (id, inner, drawer) => `
<div class="navwrap"><nav class="seg" aria-label="sections">
  ${nav.map(([k,l])=>`<a href="#${k}" data-go="${k}">${l}</a>`).join('')}
</nav></div>
<div class="wrap ${drawer?'':'wide'}">
  <div>${inner}</div>
  ${drawer?`<aside class="drawer">${drawer}</aside>`:''}
</div>`;

const item = (j, tone='') => `<div class="item"><div class="score ${tone}">${j.score}</div>
  <div style="flex:1;min-width:0"><div class="t">${j.title}</div>
    <div class="m">${j.company ?? 'no named employer'} · ${j.city} · ${j.type}</div></div>
  <button class="btn" data-act="Open ${j.title}">Open</button></div>`;

window.VARIANT = { id:'09-nightwatch', name:'Nightwatch', screens:{
dashboard: () => [`
  <h1>Thursday, 14:06</h1>
  <p class="sub">The agent has been running for 3m 41s. One site stopped it; three letters are waiting.</p>
  <div class="hero">
    <div class="stat"><div class="k">found today</div><div class="v">6</div><div class="d">2 dropped</div></div>
    <div class="stat"><div class="k">ready</div><div class="v" style="color:#7ee2a8">3</div><div class="d">need one click</div></div>
    <div class="stat"><div class="k">needs you</div><div class="v" style="color:#e3b341">2</div><div class="d">unclear signal</div></div>
    <div class="stat red"><div class="k">blocked</div><div class="v">1</div><div class="d">security check</div></div>
  </div>
  <div class="alert"><h2><span class="pulse red" style="display:inline-block;margin-right:8px"></span>rekrute.com is waiting on you</h2>
    <p>A security challenge appeared 2m 10s ago on the VPS. Every action is frozen.</p>
    <div class="row" style="margin-top:10px"><button class="btn p" data-go="verification">Take a look</button>
      <button class="btn d" data-act="Abandon run">Abandon</button></div></div>
  <div class="grid2">
    <div class="card"><h2><span class="pulse"></span>Running now<span class="r">${D.run.elapsed}</span></h2>
      <div class="runline"><b>rekrute.com</b><span class="m">${D.run.page}</span></div>
      <div class="track"><i style="width:62%"></i></div>
      <div class="m">${D.run.action} · host ${D.run.host} · pace 2.4s</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="Pause all agents">Pause</button>
        <button class="btn" data-act="Open live browser">Live view</button></div></div>
    <div class="card"><h2>Waiting for approval</h2>
      ${D.triage.ready.map(j=>`<div class="item"><div class="score">${j.score}</div>
        <div style="flex:1"><div class="t">${j.title}</div><div class="m">${j.company} · ${j.city}</div></div></div>`).join('')}
      <div class="row" style="margin-top:10px"><button class="btn p" data-go="triage">Review all three</button></div></div>
  </div>`,
  `<h3>Run 41</h3><div class="m">lease 30m · heartbeat 5s</div>
  <dl class="dl"><dt>host</dt><dd>${D.run.host}</dd><dt>pid</dt><dd class="mono">24817</dd>
    <dt>started</dt><dd>14:02</dd><dt>pages</dt><dd>1 of 3</dd><dt>found</dt><dd>6 valid</dd>
    <dt>dropped</dt><dd>2</dd><dt>trust</dt><dd>76 · caution</dd></dl>
  <div style="margin-top:14px;border-top:1px solid var(--line2);padding-top:10px">
    <h3 style="font-size:12px;color:var(--dim);margin-bottom:8px">LATEST SIGNALS</h3>
    <div class="m" style="line-height:1.7">
      14:06 · 10 cards, 0 misses<br>14:05 · 21 cards, 1 ad dropped<br>14:04 · verification wall<br>14:02 · lease acquired</div></div>`],

jobs: () => [`
  <h1>Listings</h1><p class="sub">Seven in play. Two were dropped as noise and are kept, not deleted.</p>
  <div class="card"><h2>In play<span class="r">sorted by match</span></h2>
  <table><tr><th>Title</th><th>Employer</th><th>City</th><th>Source</th><th>Pay</th><th>Signal</th><th></th></tr>
  ${D.jobs.filter(j=>j.signal!=='low').map(j=>`<tr><td><b>${j.title}</b></td><td class="m">${j.company ?? '—'}</td>
    <td>${j.city}</td><td class="m">${j.source}</td><td>${j.salary ?? '—'}</td>
    <td><span class="tag ${j.signal==='high'?'g':'a'}">${j.signal}</span></td>
    <td><button class="btn" data-go="job">Open</button></td></tr>`).join('')}</table></div>
  <div class="card"><h2>Dropped</h2>
    <div class="item"><div class="score r">0</div><div style="flex:1"><div class="t">(no title)</div>
      <div class="m">marocannonces · a banner advertisement, not a job</div></div>
      <button class="btn" data-act="Restore">Restore</button></div>
    <div class="item"><div class="score w">0</div><div style="flex:1"><div class="t">Stage marketing — non rémunéré</div>
      <div class="m">unpaid, outside your preferences</div></div>
      <button class="btn" data-act="Restore">Restore</button></div></div>`,
  `<h3>Conseiller de service</h3><div class="m">Auto Hall · Casablanca</div>
  <div style="display:flex;align-items:baseline;gap:6px;margin:10px 0 2px">
    <span style="font-size:40px;font-weight:600;letter-spacing:-.03em">88</span><span class="m">match</span></div>
  <div class="track"><i style="width:88%;background:linear-gradient(90deg,#238636,#3fb950)"></i></div>
  <dl class="dl" style="margin-top:12px"><dt>contract</dt><dd>CDI</dd><dt>level</dt><dd>Junior, 1–3 years</dd>
    <dt>education</dt><dd>Bac +2</dd><dt>sector</dt><dd>Automobile</dd><dt>salary</dt><dd>not stated</dd></dl>
  <div class="row" style="margin-top:14px"><button class="btn" data-act="Open letter">Open letter</button>
    <button class="btn p" data-act="Approve">Approve</button></div>`],

triage: () => [`
  <h1>Approve</h1><p class="sub">Approving prepares the application. The submit click stays with you.</p>
  <div class="row" style="margin-bottom:14px"><button class="btn p" data-act="Approve top 3">Approve top three</button>
    <button class="btn" data-act="Snooze rest">Snooze the rest</button></div>
  <div class="card"><h2><span class="pulse"></span>Ready<span class="r">${D.triage.ready.length}</span></h2>
    ${D.triage.ready.map(j=>item(j)).join('')}</div>
  <div class="card"><h2><span class="pulse amber"></span>Needs your judgement<span class="r">${D.triage.needsYou.length}</span></h2>
    ${D.triage.needsYou.map(j=>`<div class="item"><div class="score w">${j.score}</div>
      <div style="flex:1"><div class="t">${j.title}</div><div class="m">${j.company} · ${j.honesty}</div></div>
      <button class="btn" data-act="Review ${j.title}">Review</button></div>`).join('')}</div>
  <div class="card"><h2>Set aside<span class="r">${D.triage.skip.length}</span></h2>
    ${D.triage.skip.map(j=>`<div class="item"><div class="score r">${j.score}</div>
      <div style="flex:1"><div class="t">${j.title}</div><div class="m">${j.honesty}</div></div>
      <button class="btn" data-act="Restore ${j.title}">Restore</button></div>`).join('')}</div>`,
  `<h3>Guard rails</h3><div class="m">These do not have settings.</div>
  <dl class="dl"><dt>submit</dt><dd>you, always</dd><dt>captcha</dt><dd>never touched</dd>
    <dt>on freeze</dt><dd>everything stops</dd><dt>on error</dt><dd>visible, not retried</dd></dl>
  <div style="margin-top:14px"><button class="btn" data-go="verification">1 run is frozen</button></div>`],

verification: () => [`
  <h1>Verification</h1><p class="sub">A human check appeared. The agent froze in 1.4 seconds and sent one push.</p>
  <div class="alert"><h2><span class="pulse red" style="display:inline-block;margin-right:8px"></span>rekrute.com · ${D.verification.age}</h2>
    <p class="mono" style="word-break:break-all">${D.verification.url}</p></div>
  <div class="card"><h2>What the agent sees</h2>
    <div class="shot">screenshot of the paused tab · codes redacted</div>
    <div class="row"><input class="code" type="text" placeholder="000000" aria-label="code">
      <button class="btn p" data-act="Submit code and resume">Submit and resume</button>
      <button class="btn" data-act="I finished — resume">I finished it myself</button>
      <button class="btn d" data-act="Abandon run">Abandon</button></div>
    <div class="m" style="margin-top:8px">No auto-retry. No timer. No solving service. The run waits for you.</div></div>
  <div class="card"><h2>Earlier</h2>
    <div class="item"><div class="score r">!</div><div style="flex:1"><div class="t">rekrute.com · security challenge</div>
      <div class="m">today 14:04 · VPS · open</div></div></div>
    <div class="item"><div class="score">✓</div><div style="flex:1"><div class="t">linkedin.com · email code</div>
      <div class="m">yesterday 09:12 · PC · resolved in 1m 20s</div></div></div></div>`,
  `<h3>Where it went</h3><div class="m">Check these before asking for a new code.</div>
  <dl class="dl"><dt>account</dt><dd>${D.verification.guidance.account}</dd>
    <dt>search</dt><dd class="mono">${D.verification.guidance.search}</dd>
    <dt>phone</dt><dd class="mono">${D.verification.guidance.phone}</dd>
    <dt>valid</dt><dd>${D.verification.guidance.validFor}</dd></dl>
  <div style="margin-top:14px;border-top:1px solid var(--line2);padding-top:10px">
    <h3 style="font-size:12px;color:var(--dim)">CONTEXT</h3>
    <div class="m" style="line-height:1.7">${D.verification.run}<br>detected ${D.verification.at}<br>push delivered 1.4s</div></div>`],

doctor: () => [`
  <h1>Health</h1><p class="sub">Eleven checks pass. Two failures are logged, never hidden.</p>
  <div class="hero" style="grid-template-columns:1.4fr 1fr 1fr 1fr">
    <div class="stat"><div class="k">browser trust</div><div class="v">76<small style="font-size:13px;color:var(--dim)">/100</small></div>
      <div class="d">caution · estimate, not a guarantee</div></div>
    <div class="stat"><div class="k">passing</div><div class="v" style="color:#7ee2a8">11</div><div class="d">of 15</div></div>
    <div class="stat"><div class="k">warnings</div><div class="v" style="color:#e3b341">2</div><div class="d">not blocking</div></div>
    <div class="stat red"><div class="k">failing</div><div class="v">2</div><div class="d">logged</div></div>
  </div>
  <div class="card"><h2>Checks</h2>
  <table><tr><th>State</th><th>Check</th><th>Why it matters</th><th></th></tr>
  ${D.doctor.map(c=>`<tr><td><span class="tag ${c.state==='PASS'?'g':c.state==='WARN'?'a':'r'}">${c.state}</span></td>
    <td>${c.name}</td><td class="m">${c.why}</td>
    <td>${c.fix?`<button class="btn" data-act="${c.fix}">Fix</button>`:''}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="Re-run checks">Re-run all</button>
    <button class="btn d" data-act="Run anyway (logged)">Run anyway, logged</button></div></div>`,
  `<h3>Two failures, plainly</h3>
  <div class="m" style="margin-bottom:10px">Fixing either raises the score. Ignoring either is allowed and recorded.</div>
  <div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px">
    <div class="t">No WebGL context</div><div class="m">Under Xvfb there is no renderer. SwiftShader would be a different tell. Install Mesa llvmpipe.</div></div>
  <div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px">
    <div class="t">Timezone mismatch</div><div class="m">UTC in the browser, Berlin on the address. Set TZ or change the egress region.</div></div>
  <div style="margin-top:14px"><button class="btn" data-go="logs">See the run log</button></div>`],

logs: () => [`
  <h1>Activity</h1><p class="sub">Every action, in order. Secrets redacted at write time.</p>
  <div class="row" style="margin-bottom:12px"><span class="tag b">level: all</span><span class="tag">agent: all</span>
    <span class="tag">site: all</span><span class="tag">run 41</span>
    <button class="btn" style="margin-left:auto" data-act="Export diagnostic bundle">Export bundle</button></div>
  <div class="card"><h2><span class="pulse"></span>Live tail</h2>
  <table>${D.logs.map(l=>`<tr><td class="m mono" style="width:58px">${l.t}</td>
    <td style="width:52px"><span class="tag ${l.lvl==='INFO'?'g':l.lvl==='WARN'?'a':'r'}">${l.lvl}</span></td>
    <td class="m" style="width:60px">${l.agent}</td><td>${l.msg}</td>
    <td class="m" style="width:44px">${l.dur}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="Explain last error">Explain last error</button></div></div>`,
  `<h3>Run 41</h3><div class="m">Lease on the VPS, heartbeat every 5 seconds.</div>
  <div class="m" style="line-height:1.9;margin-top:10px">
    14:02 lease acquired<br>14:02 browser attached<br>14:06 page one parsed<br>14:04 wall detected<br>--:-- waiting for you</div>
