<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guided</title>
<style>
  :root{
    --bg:#fbfbfc; --card:#fff; --ink:#111827; --dim:#6b7280; --line:#e5e7eb;
    --teal:#0f766e; --teal-wash:#e6f4f1; --red:#b42318; --red-wash:#fef3f2; --amber:#b54708; --amber-wash:#fffaeb;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);
    display:flex;flex-direction:column;min-height:100vh;padding-bottom:74px}
  a{color:var(--teal);text-decoration:none}
  .top{position:sticky;top:0;z-index:6;background:rgba(251,251,252,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .top .in{max-width:1040px;margin:0 auto;padding:12px 24px 10px;display:flex;align-items:center;gap:14px}
  .mark{font-weight:700;font-size:16px;letter-spacing:-.02em}
  .mark span{color:var(--teal)}
  .where{margin-left:auto;font-size:13px;color:var(--dim)}
  .where b{color:var(--ink)}
  .ticks{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:0 24px 10px}
  .ticks a{height:4px;background:#e5e7eb;border-radius:2px;display:block}
  .ticks a.done{background:#9ed3ca}
  .ticks a.is-active{background:var(--teal)}
  main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:40px 24px 30px}
  .narrow{max-width:720px;margin:0 auto}
  .stepno{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:600}
  h1{font-size:38px;line-height:1.12;letter-spacing:-.028em;margin:6px 0 10px;font-weight:700}
  .lede{font-size:17.5px;color:var(--dim);margin:0 0 26px;max-width:56ch}
  h2{font-size:15px;margin:26px 0 10px;letter-spacing:-.01em}
  .choice{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;
    cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .choice:hover{border-color:#c9d3d1}
  .choice.primary{border-color:#9ed3ca;box-shadow:0 0 0 3px #effaf8}
  .choice .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--teal-wash);
    color:var(--teal);font-weight:700;font-size:15px}
  .choice.danger .ic{background:var(--red-wash);color:var(--red)}
  .choice.warn .ic{background:var(--amber-wash);color:var(--amber)}
  .choice .t{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
  .choice .d{font-size:14px;color:var(--dim);margin-top:2px}
  .choice .go{align-self:center;font-size:22px;color:#9ca3af}
  .quote{border-left:3px solid var(--teal);padding:2px 0 2px 14px;color:var(--ink);font-size:16px;margin:0 0 22px}
  .kv{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .kv div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
  .kv div:last-child{border-bottom:0}
  .kv span{color:var(--dim)}
  .kv b{font-weight:500}
  .big{font-size:64px;line-height:1;letter-spacing:-.04em;font-weight:700;font-variant-numeric:tabular-nums}
  .big small{font-size:15px;font-weight:500;color:var(--dim);letter-spacing:0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{font:15px var(--sans);border-radius:10px;border:1px solid var(--line);background:#fff;padding:10px 18px;
    cursor:pointer;color:var(--ink);font-weight:500}
  button:hover{background:#f9fafb}
  button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  button.primary:hover{background:#0c655e}
  button.danger{color:var(--red);border-color:#fecdca;background:var(--red-wash)}
  button.ghost{background:transparent}
  input.code{font:22px ui-monospace,Menlo,monospace;letter-spacing:.45em;padding:10px 14px;width:220px;
    border:1px solid var(--line);border-radius:10px;text-align:center}
  .shot{background:#fff;border:1px dashed #d7c4c4;border-radius:10px;height:150px;display:grid;place-items:center;
    color:#a99a9a;font-size:13px;margin:0 0 16px}
  .timeline{display:grid;gap:0;margin:0 0 16px}
  .tl{display:grid;grid-template-columns:74px 10px 1fr;gap:14px;font-size:14px;padding:0 0 14px;position:relative}
  .tl .t{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
  .tl .d{width:9px;height:9px;border-radius:50%;background:#d1d5db;margin-top:6px;position:relative}
  .tl .d::before{content:"";position:absolute;left:4px;top:12px;width:1px;height:calc(100% + 4px);background:var(--line)}
  .tl:last-child .d::before{display:none}
  .tl.hot .d{background:var(--red)}
  .tl.ok .d{background:var(--teal)}
  .tl .m{color:var(--dim);font-size:13px}
  .note{background:var(--teal-wash);border-radius:12px;padding:14px 16px;font-size:14px;color:#0b5f58;margin-bottom:16px}
  .phone{width:340px;max-width:100%;margin:0 auto;background:#111;border-radius:30px;padding:9px}
  .phone .scr{background:#fff;border-radius:23px;overflow:hidden}
  .phone .hd{padding:12px 14px 6px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  .phone .it{padding:14px;border-top:1px solid var(--line)}
  .phone .it .t{font-size:15px;font-weight:600}
  .phone .it .m{font-size:12.5px;color:var(--dim)}
  .phone .tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);
    font-size:10.5px;color:var(--dim);text-align:center;padding:9px 0 12px}
  .phone .tabs .on{color:var(--teal);font-weight:700}
  .foot{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
    backdrop-filter:blur(8px);z-index:8}
  .foot .in{max-width:1040px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:10px}
  .foot .mid{font-size:12.5px;color:var(--dim);margin:0 auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 4px;font-size:15px}
  .card p{margin:0;font-size:13.5px;color:var(--dim)}
  .sw{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block}
  .dot.r{background:var(--red)}.dot.y{background:var(--amber)}
  .mock-toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
    padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:99}
  @media(max-width:720px){
    h1{font-size:29px}.lede{font-size:16px}
    .grid2{grid-template-columns:1fr}
    .kv div{grid-template-columns:110px 1fr}
    .foot .mid{display:none}
    .phone{width:100%}
    main{padding:26px 18px}
    .top .in,.ticks,.foot .in{padding-left:18px;padding-right:18px}
  }
</style></head><body>
<script src="../../shared/data.js"></script>
<script>
const D = window.JOBPILOT;
const order = [['dashboard','Today'],['jobs','Listings'],['triage','Approve'],['verification','Verification'],
  ['doctor','Health'],['logs','Activity'],['scope','Sites'],['agent','Browser'],
  ['credentials','Passwords'],['data','Backup'],['onboarding','Setup'],['pwa','Phone']];

const shell = (id, inner, opts={}) => {
  const i = order.findIndex(([k])=>k===id);
  const [k,label] = order[i];
  return `
<header class="top">
  <div class="in"><div class="mark">job<span>Pilot</span></div>
    <div class="where">${D.user.name} · ${D.hosts[1].id} synced · step <b>${i+1}</b> of 12 · <b>${label}</b></div></div>
  <div class="ticks">${order.map(([sk],j)=>`<a href="#${sk}" data-go="${sk}" class="${j<i?'done':''}"></a>`).join('')}</div>
</header>
<main>${inner}</main>
<footer class="foot"><div class="in">
  ${i>0?`<button class="ghost" data-go="${order[i-1][0]}">← ${order[i-1][1]}</button>`:'<span></span>'}
  <span class="mid">${opts.hint ?? 'One decision per screen · nothing is submitted without your click'}</span>
  ${i<order.length-1?`<button data-go="${order[i+1][0]}">${order[i+1][1]} →</button>`:'<span></span>'}
</div></footer>`;
};

const choice = (ic,t,d,cls='') => `<div class="choice ${cls}"><div class="ic">${ic}</div>
  <div><div class="t">${t}</div><div class="d">${d}</div></div><div class="go">→</div></div>`;

window.VARIANT = { id:'08-guided', name:'Guided', screens:{
dashboard: () => `<div class="narrow">
  <div class="stepno">Step 1 · today</div>
  <h1>Good morning. Four things need a human.</h1>
  <p class="lede">The agent found six listings overnight. One site is holding it up with a security check. Nothing is sent until you say so.</p>
  <a href="#verification" data-go="verification" style="display:block;color:inherit">${choice('!','Resolve the check on rekrute.com','Frozen for 2m 10s on the VPS. The run cannot continue until you look.','primary danger')}</a>
  <a href="#triage" data-go="triage" style="display:block;color:inherit">${choice('3','Approve three applications','Auto Hall, Alten Maroc and AKDITAL scored 81 or better.')}</a>
  <a href="#triage" data-go="triage" style="display:block;color:inherit">${choice('2','Decide on two unclear listings','One has no named employer; the other used all three review rounds.','warn')}</a>
  <a href="#jobs" data-go="jobs" style="display:block;color:inherit">${choice('6','Look at what was found','Six valid listings, two dropped as noise.')}</a>
  <div class="note" style="margin-top:22px"><b>Nothing was submitted.</b> The agent fills forms; you press send. It never solves a captcha or a code.</div>
</div>`,

jobs: () => `<div class="narrow">
  <div class="stepno">Step 2 · listings</div>
  <h1>Six listings are in play.</h1>
  <p class="lede">Two were dropped automatically. Keep them out, or bring them back one by one.</p>
  ${D.jobs.filter(j=>j.signal!=='low').slice(0,5).map(j=>`<div class="choice"><div class="ic">${j.signal==='high'?'✓':'~'}</div>
    <div><div class="t">${j.title}</div><div class="d">${j.company ?? 'employer not named'} · ${j.city} · ${j.source}${j.salary?` · ${j.salary}`:''}</div></div>
    <div class="go">›</div></div>`).join('')}
  <h2>Dropped as noise</h2>
  <div class="grid2">
    <div class="card"><h3>(no title)</h3><p>marocannonces · a banner advertisement, not a job</p>
      <div class="row" style="margin-top:10px"><button data-act="Restore">Bring it back</button></div></div>
    <div class="card"><h3>Stage marketing — non rémunéré</h3><p>Unpaid, outside what you asked for</p>
      <div class="row" style="margin-top:10px"><button data-act="Restore">Bring it back</button></div></div>
  </div>
</div>`,

triage: () => `<div class="narrow">
  <div class="stepno">Step 3 · approval · 1 of 5</div>
  <h1>Conseiller de service</h1>
  <p class="lede">Auto Hall, Casablanca. CDI, junior, automobile sector. Match 88 of 100.</p>
  <div class="kv">
    <div><span>Why it fits</span><b>Customer intake and warranty work match your last two years</b></div>
    <div><span>What is honest</span><b>Every claim in the letter maps to a line in the resume</b></div>
    <div><span>What is missing</span><b>No salary stated; the posting is silent on hours</b></div>
    <div><span>What happens next</span><b>The form is filled for you to review and submit</b></div>
  </div>
  <div class="row"><button class="primary" data-act="Approve">Approve this one</button>
    <button data-act="Skip">Skip</button>
    <button class="ghost" data-act="Read the letter">Read the letter first</button></div>
  <p class="lede" style="font-size:14px;margin-top:22px">Two more are ready behind this one. Two need a real decision — one has no named employer.</p>
</div>`,

verification: () => `<div class="narrow">
  <div class="stepno">Step 4 · verification</div>
  <h1>The agent is stuck on a security check.</h1>
  <p class="lede">rekrute.com asked for a human check at 14:04 on the VPS. Everything stopped. It will not guess, retry, or move on.</p>
  <div class="shot">screenshot of the paused tab · one-time values redacted</div>
  <div class="kv">
    <div><span>Went to</span><b>${D.verification.guidance.account}</b></div>
    <div><span>Search inbox for</span><b>${D.verification.guidance.search}</b></div>
    <div><span>Phone on file</span><b>${D.verification.guidance.phone}</b></div>
    <div><span>Valid for</span><b>${D.verification.guidance.validFor}</b></div>
  </div>
  <h2>Enter the code</h2>
  <div class="row"><input class="code" type="text" placeholder="000000" aria-label="one-time code">
    <button class="primary" data-act="Submit code and resume">Submit and continue</button></div>
  <p class="lede" style="font-size:14px;margin-top:18px">Or finish it yourself:
    <button data-act="I finished — resume" style="margin-left:6px">I resolved it in the browser</button></p>
  <p style="margin-top:26px"><button class="danger" data-act="Abandon run">Abandon this run instead</button></p>
</div>`,

doctor: () => `<div class="narrow">
  <div class="stepno">Step 5 · health</div>
  <h1>Eleven checks pass. Two are worth fixing.</h1>
  <p class="lede">Neither stops a run today, and neither is hidden. If you run anyway, both failures are written to the log.</p>
  <div class="row" style="gap:26px;margin-bottom:22px">
    <div><div class="big">76<small>/100</small></div><div class="sw"><i class="dot y"></i>browser trust · caution</div></div>
    <div style="font-size:13.5px;color:var(--dim);max-width:34ch">An estimate, not a guarantee. Bans are possible at any score.</div>
  </div>
  <a href="#doctor" data-go="doctor" style="display:block;color:inherit">${choice('!','No WebGL context','Under Xvfb there is no renderer, which is an unusual fingerprint. Install Mesa llvmpipe.','danger')}</a>
  <a href="#doctor" data-go="doctor" style="display:block;color:inherit">${choice('!','Clock says UTC, address says Berlin','A mismatch sites can see. Set the timezone, or accept it knowingly.','danger')}</a>
  ${choice('~','Tectonic is not installed','PDF export falls back to Markdown. Fix before you apply to anything.','warn')}
  <div class="row" style="margin-top:20px"><button data-act="Re-run checks">Run the checks again</button>
    <button class="danger" data-act="Run anyway (logged)">Run anyway, and log both failures</button></div>
</div>`,

logs: () => `<div class="narrow">
  <div class="stepno">Step 6 · activity</div>
  <h1>What happened, in order.</h1>
  <p class="lede">One run, ten events. Secrets and codes are removed before anything is written here.</p>
  <div class="timeline">
    ${D.logs.slice(0,8).map(l=>`<div class="tl ${l.lvl==='ALERT'?'hot':l.lvl==='INFO'?'':'hot'}">
      <div class="t">${l.t}</div><div class="d"></div>
      <div><b style="font-weight:600">${l.msg}</b>
        <div class="m">${l.agent}${l.site!=='—'?` · ${l.site}`:''} · ${l.dur}</div></div></div>`).join('')}
  </div>
  <div class="row"><button data-act="Export diagnostic bundle">Export a diagnostic bundle</button>
    <button data-act="Explain last error">Explain the last error</button>
    <span style="font-size:13px;color:var(--dim)">kept 30 days</span></div>
</div>`,

scope: () => `<div class="narrow">
  <div class="stepno">Step 7 · where to look</div>
  <h1>Six sites, three places.</h1>
  <p class="lede">You chose these at setup. Change them any time — the agent never goes outside this list.</p>
  ${D.sites.map(s=>`<div class="choice"><div class="ic">${s.mode==='api'?'{}':s.mode==='paste'?'⌘':'◈'}</div>
    <div><div class="t">${s.host}</div><div class="d">${s.mode} · ${s.state} · ${s.found} found · last scan ${s.lastScan}</div></div>
    <div class="go">›</div></div>`).join('')}
  <h2>Places</h2>
  <div class="grid2">
    ${D.locations.map(l=>`<div class="card"><h3>${l.country}</h3><p>${l.cities.join(', ')||'any city'} · ${l.count} found</p></div>`).join('')}
  </div>
  <div class="row" style="margin-top:16px"><button data-act="Add a site">Add a site</button>
    <button data-act="Add a place">Add a place</button></div>
  <div class="note" style="margin-top:18px">No adapter for a site? Paste one URL and the agent reads that page. There is no open-web crawl mode.</div>
</div>`,

agent: () => `<div class="narrow">
  <div class="stepno">Step 8 · browser</div>
  <h1>Which browser should drive?</h1>
  <p class="lede">A dedicated profile, never your everyday browser. Brave is detected on this machine.</p>
  <div class="grid2" style="margin-bottom:20px">
    <div class="choice primary" style="margin:0"><div class="ic">B</div>
      <div><div class="t">Brave 1.98.60</div><div class="d">Detected · shields strip the ad frames that break listings</div></div></div>
    <div class="choice" style="margin:0"><div class="ic">C</div>
      <div><div class="t">Google Chrome</div><div class="d">Not installed on this host; available on your PC</div></div></div>
  </div>
  <h2>Before the first run, confirm three things</h2>
  <div class="kv">
    <div><span>Cookies survive close</span><b style="color:var(--teal)">verified</b></div>
    <div><span>History survives close</span><b style="color:var(--teal)">verified</b></div>
    <div><span>Continue where you left off</span><b style="color:var(--teal)">verified</b></div>
  </div>
  <div class="note">The plan called this a “Forgetful Browsing” gate. Brave desktop has no global toggle by that name; these three preferences are what actually decide whether logins survive a restart.</div>
  <div class="row"><button class="primary" data-act="Re-check now">Re-check now</button>
    <button data-act="Restart browser">Restart the browser</button>
    <button class="ghost" data-go="credentials">Open passwords</button></div>
</div>`,

credentials: () => `<div class="narrow">
  <div class="stepno">Step 9 · passwords</div>
  <h1>Four sign-ins, stored on this machine.</h1>
  <p class="lede">Encrypted with your passphrase. Values are used only to fill a form, and never appear in a prompt or a log.</p>
  ${D.credentials.map(c=>`<div class="choice"><div class="ic">${c.site.startsWith('gmail')?'@':'⌘'}</div>
    <div><div class="t">${c.site}</div><div class="d">${c.user} · ${c.kind} · used ${c.uses} times, last ${c.lastUsed}</div></div>
    <div class="go">›</div></div>`).join('')}
  <div class="row" style="margin-top:18px"><button data-act="Lock vault">Lock the vault</button>
    <button data-act="Rotate passphrase">Change passphrase</button>
    <span style="font-size:13px;color:var(--dim)">every reveal is logged</span></div>
  <h2>Recent access</h2>
  <div class="timeline">
    <div class="tl"><div class="t">14:04</div><div class="d ok"></div><div>Filled the rekrute.com form<div class="m">run 41</div></div></div>
    <div class="tl"><div class="t">13:58</div><div class="d ok"></div><div>Revealed marocannonces.com<div class="m">passphrase accepted</div></div></div>
  </div>
</div>`,

data: () => `<div class="narrow">
  <div class="stepno">Step 10 · backup</div>
  <h1>Two machines disagree about one thing.</h1>
  <p class="lede">Both changed the send hours while offline. Because it decides when the agent may act, it will not resolve itself.</p>
  <div class="grid2" style="margin-bottom:18px">
    ${D.hosts.map(h=>`<div class="card"><h3>${h.id} · ${h.label}</h3>
      <p>${h.events} events · ${h.db} · heartbeat ${h.heartbeat}<br>last merge ${h.lastSync}</p></div>`).join('')}
  </div>
  <div class="choice primary" style="cursor:default"><div class="ic">?</div>
    <div><div class="t">${D.sync.conflict.field}</div>
      <div class="d">PC: ${D.sync.conflict.pc}<br>VPS: ${D.sync.conflict.vps}</div></div></div>
  <div class="row"><button class="primary" data-act="Keep PC value">Keep the PC value</button>
    <button data-act="Keep VPS value">Keep the VPS value</button></div>
  <h2>Everything else</h2>
  <div class="row"><button data-act="Sync now">Sync now</button>
    <button data-act="Export everything">Export everything</button>
    <button class="danger" data-act="Delete everything on both hosts">Delete everything</button></div>
</div>`,

onboarding: () => `<div class="narrow">
  <div class="stepno">Step 11 · setup · 3 of 5 done</div>
  <h1>Two minutes left.</h1>
  <p class="lede">Everything here can be changed later, without starting over.</p>
  ${[['OpenRouter key','Valid · claude-haiku · 412 credits',true],
     ['Resume','v4 parsed · 82% fit · three fields to confirm',true],
     ['Job type and places','Internships and full-time · Casablanca, Rabat, Remote',true],
     ['The browser','Brave found. Confirm logins survive a restart.',false],
     ['The honest warning','Bans are possible. Nothing sends without your click.',false]]
   .map(([t,d,done],i)=>`<div class="choice ${done?'':'primary'}"><div class="ic">${done?'✓':i+1}</div>
     <div><div class="t">${t}</div><div class="d">${d}</div></div>
     <div class="go">${done?'':'→'}</div></div>`).join('')}
  <div class="row" style="margin-top:16px"><button class="primary" data-go="agent">Finish the browser step</button>
    <button data-act="Run first scan">Run the first scan</button></div>
</div>`,

pwa: () => `<div class="narrow">
  <div class="stepno">Step 12 · phone</div>
  <h1>Two jobs for the phone.</h1>
  <p class="lede">Unblock the agent, and approve or skip a letter. Everything else is better on a bigger screen.</p>
  <div class="phone"><div class="scr">
    <div class="hd"><span>VPS · synced</span><span>trust 76</span></div>
    <div class="it" style="background:var(--red-wash)">
