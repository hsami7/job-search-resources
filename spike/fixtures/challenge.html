<!doctype html>
<meta charset=utf-8>
<title>Security check</title>
<style>
  body{font:15px system-ui;display:grid;place-items:center;height:100vh;margin:0;background:#fafafa}
  .box{border:1px solid #ddd;padding:32px;border-radius:8px;background:#fff;text-align:center;max-width:420px}
  .cap{letter-spacing:6px;font:700 26px monospace;background:#eee;padding:10px 18px;margin:16px 0}
  input,button{padding:8px;font-size:15px}
</style>
<div class="box">
  <h2>Verify you are human</h2>
  <p>Type the characters shown below to continue.</p>
  <div class="cap">7 K Q 2</div>
  <input id="c" placeholder="characters">
  <button onclick="document.body.innerHTML='<h2>done</h2>'">Continue</button>
</div>
